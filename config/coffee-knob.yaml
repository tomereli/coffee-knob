# =============================================================================
# coffee-knob  -  M0: HARDWARE PROOF
# Waveshare ESP32-S3-Knob-Touch-LCD-1.8 / Guition JC3636K518C-I-YR1
#
# PROVENANCE - every hardware value below is copied verbatim from
# KrX3D/WaveShare-Knob-Esp32S3 @ 5e22f98. The unmodified upstream files are
# kept in packages/ for diffing. Sections are tagged [esp-config] /
# [waveshare] / [drv2605] to show which upstream file they came from.
# NO PIN NUMBER IN THIS FILE WAS INVENTED.
#
# Flattened into one file (rather than !include) because the ESPHome Device
# Builder add-on stores one YAML document per device.
# =============================================================================

esphome:                                              # [esp-config]
  name: coffee-knob
  friendly_name: "Coffee Knob"
  comment: "La Marzocco Micra knob"
  platformio_options:
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L
  on_boot:                                            # [waveshare]
    - priority: -100
      then:
        - delay: 2s
        - light.turn_on:
            id: back_light
            brightness: 50%
        - script.execute: screentime

esp32:                                                # [esp-config]
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:                                                # [esp-config]
  mode: octal
  speed: 80MHz

# UART link to the board's SECOND MCU (plain ESP32 + PCM5100 DAC).
# Not used by the POC, kept because it is part of the upstream bring-up.
uart:                                                 # [esp-config]
  id: audio_uart
  tx_pin: GPIO41
  rx_pin: GPIO40
  baud_rate: 115200
  rx_buffer_size: 1024

# --- Display: ST77916 over QSPI --------------------------------- [waveshare]
spi:
  id: display_qspi
  type: quad
  clk_pin: 13
  data_pins: [15, 16, 17, 18]

display:
  - platform: mipi_spi
    id: main_display
    model: JC3636W518V2
    data_rate: 80MHz
    color_order: rgb
    rotation: 0
    cs_pin: 14
    reset_pin: 21
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
    dimensions:
      height: 360
      width: 360

# --- Touch: CST816 ---------------------------------------------- [waveshare]
i2c:
  sda: 11
  scl: 12
  scan: true
  id: ic_bus

touchscreen:
  - platform: cst816
    id: my_touchscreen
    display: main_display
    interrupt_pin: GPIO9
    reset_pin: GPIO10
    transform:
      mirror_x: false
      mirror_y: false
      swap_xy: false
    on_touch:
      - logger.log:
          format: "M0 TOUCH at (%d, %d)"
          args: [touch.x, touch.y]
      - binary_sensor.template.publish:
          id: touch_input
          state: ON
      - script.execute: screentime
    on_release:
      - binary_sensor.template.publish:
          id: touch_input
          state: OFF

# --- Backlight --------------------------------------------------- [waveshare]
output:
  - platform: ledc
    pin: GPIO47
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    icon: "mdi:television"
    entity_category: config
    id: back_light
    restore_mode: ALWAYS_ON
    default_transition_length:
      milliseconds: 30
    initial_state:
      brightness: 50%
    on_turn_off:
      - lvgl.pause:
          show_snow: true
    on_turn_on:
      - lvgl.resume:

script:                                               # [waveshare]
  - id: screentime
    mode: restart
    then:
      - light.turn_on: back_light
      - delay: 10 min          # upstream default 30s; lengthened so the
      - light.turn_off: back_light   # screen does not blank mid-M0-test
  - id: screenoff
    then:
      - script.stop: screentime
      - light.turn_off: back_light

# --- Haptics: DRV2605 + LRA -------------------------------------- [drv2605]
external_components:
  - source: github://RAR/esphome-drv2605
    components: [drv2605]
    refresh: 0s
  # The knob is NOT a quadrature encoder - two switches, one pulse per detent,
  # direction encoded by WHICH pin pulses. Stock rotary_encoder reads zero.
  - source:
      type: git
      url: https://github.com/KrX3D/WaveShare-Knob-Esp32S3
      ref: 5e22f98908f758e38f6412e021554d90234bb5ff
    components: [rotary_encoder_custom]

drv2605:
  id: haptic_driver
  motor_type: LRA
  library: 6
  address: 0x5A

# =============================================================================
# Glue below this line: identity, network, and the M0 test UI.
# =============================================================================

logger:
  level: DEBUG

api:
  encryption:
    key: !secret coffee_knob_api_key

ota:
  - platform: esphome
    password: !secret coffee_knob_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Coffee Knob Fallback"
    password: !secret coffee_knob_ap_password

captive_portal:

binary_sensor:
  - platform: template                                # [waveshare]
    name: "Touch Button"
    id: touch_input
  - platform: status
    name: "Connection Status"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"

globals:
  - id: touch_count
    type: int
    restore_value: false
    initial_value: '0'

number:                                               # [drv2605]
  - platform: template
    name: "Haptic Intensity"
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 255
    optimistic: true
    entity_category: config
    set_action:
      - drv2605.set_realtime_value:
          id: haptic_driver
          value: !lambda "return x;"

# --- M0 check 2: knob rotation ---
sensor:
  - platform: rotary_encoder_custom
    name: "Knob"
    id: knob
    pin_a: GPIO8
    pin_b: GPIO7
    min_value: -999
    max_value: 999
    publish_initial_value: true
    restore_mode: ALWAYS_ZERO
    on_clockwise:
      - logger.log: "M0 KNOB: CW"
      - lvgl.label.update:
          id: lbl_knob
          text: !lambda |-
            static char b[28];
            snprintf(b, sizeof(b), "knob %d  CW", (int) id(knob).state);
            return b;
      - drv2605.play_effect:
          id: haptic_driver
          effect: 7
    on_anticlockwise:
      - logger.log: "M0 KNOB: CCW"
      - lvgl.label.update:
          id: lbl_knob
          text: !lambda |-
            static char b[28];
            snprintf(b, sizeof(b), "knob %d  CCW", (int) id(knob).state);
            return b;
      - drv2605.play_effect:
          id: haptic_driver
          effect: 7

# --- M0 checks 1 + 3: screen renders, touch produces events ---
# LVGL built-in Montserrat fonts: no compile-time font download.
lvgl:
  id: my_lvgl
  displays: [main_display]
  touchscreens: [my_touchscreen]
  color_depth: 16
  buffer_size: 24%
  pages:
    - id: m0_page
      on_click:
        - logger.log: "M0 LVGL: click"
        - lambda: 'id(touch_count) += 1;'
        - lvgl.label.update:
            id: lbl_touch
            text: !lambda |-
              static char b[24];
              snprintf(b, sizeof(b), "touch %d", id(touch_count));
              return b;
        - drv2605.play_effect:
            id: haptic_driver
            effect: 1
      widgets:
        - label:
            id: lbl_title
            text: "M0"
            text_font: montserrat_40
            text_color: 0x00FF88
            align: CENTER
            y: -70
        - label:
            id: lbl_knob
            text: "knob 0"
            text_font: montserrat_28
            text_color: 0xFFFFFF
            align: CENTER
            y: 0
        - label:
            id: lbl_touch
            text: "touch 0"
            text_font: montserrat_28
            text_color: 0xFFFFFF
            align: CENTER
            y: 50
        - label:
            id: lbl_hint
            text: "turn + tap"
            text_font: montserrat_28
            text_color: 0x888888
            align: CENTER
            y: 110
