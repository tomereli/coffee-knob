# =============================================================================
# coffee-knob - Waveshare ESP32-S3-Knob-Touch-LCD-1.8 / Guition JC3636K518C
#
# PROVENANCE - hardware values verbatim from KrX3D/WaveShare-Knob-Esp32S3
# @ 5e22f98, cross-checked against the board schematic. No pin invented.
#   Display QSPI: CLK 13, D0-3 15/16/17/18, CS 14, RST 21   (ST77916)
#   Touch  I2C:   SDA 11, SCL 12, INT 9, RST 10             (CST816D @ 0x15)
#   Haptic I2C:   same bus, DRV2605 @ 0x5A, EN strapped 3V3, TRIG to GND
#   Knob EC1:     A GPIO8, B GPIO7  (EC2 is on the OTHER MCU - not used)
#   Backlight:    GPIO47 (PWM)
#
# INTERACTION MODEL
#   main:     short tap -> control page       long press -> toggle power
#   control:  turn -> move / adjust           short tap -> act
#             long press -> back to main (or START backflush on that item)
#   shot:     automatic on brewing_active
# =============================================================================

substitutions:
  micra_power:       switch.la_minea_micra
  micra_brewing:     binary_sensor.la_minea_micra_brewing_active
  micra_steam:       switch.la_minea_micra_steam_boiler
  micra_steam_level: select.la_minea_micra_steam_level
  micra_temp:        number.la_minea_micra_coffee_target_temperature
  micra_backflush:   button.la_minea_micra_start_backflush
  screen_timeout:    5min
  shot_full_scale_ds: "400"

esphome:
  name: coffee-knob
  friendly_name: "Coffee Knob"
  comment: "La Marzocco Micra knob"
  platformio_options:
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L
  on_boot:
    - priority: -100
      then:
        - delay: 2s
        - script.execute: haptic_init
        - light.turn_on:
            id: back_light
            brightness: 60%
        - script.execute: screentime
        - script.execute: paint_main

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  encryption:
    key: !secret coffee_knob_api_key
  on_client_connected:
    - delay: 2s
    - script.execute: paint_main

ota:
  - platform: esphome
    password: !secret coffee_knob_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Coffee Knob Fallback"
    password: !secret coffee_knob_ap_password

captive_portal:

# --- Display: ST77916 over QSPI ---
# rotation lives on the lvgl: block. LVGL rejects display-level rotation and
# rotates touch input itself via rotate_coordinates().
spi:
  id: display_qspi
  type: quad
  clk_pin: 13
  data_pins: [15, 16, 17, 18]

display:
  - platform: mipi_spi
    id: main_display
    model: JC3636W518V2
    data_rate: 80MHz
    color_order: rgb
    rotation: 0
    cs_pin: 14
    reset_pin: 21
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
    dimensions:
      height: 360
      width: 360

i2c:
  sda: 11
  scl: 12
  scan: true
  id: ic_bus

touchscreen:
  - platform: cst816
    id: my_touchscreen
    display: main_display
    interrupt_pin: GPIO9
    reset_pin: GPIO10
    transform:
      mirror_x: false
      mirror_y: false
      swap_xy: false
    on_touch:
      - script.execute: screentime

output:
  - platform: ledc
    pin: GPIO47
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    icon: "mdi:television"
    entity_category: config
    id: back_light
    restore_mode: ALWAYS_ON
    default_transition_length:
      milliseconds: 30
    initial_state:
      brightness: 60%
    on_turn_off:
      - lvgl.pause:
          show_snow: false
    on_turn_on:
      - lvgl.resume:

# --- Icons: Material Design Icons webfont ---
# Vector glyphs: they scale and take colour. Fetched at COMPILE time from
# raw.githubusercontent (github.com/.../raw/... is proxy-blocked) and baked
# into the firmware, so nothing is fetched at runtime.
font:
  - file: &mdi_ttf "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_64
    size: 64
    bpp: 4
    glyphs: ["\U000F04D3"]
  - file: *mdi_ttf
    id: mdi_40
    size: 40
    bpp: 4
    glyphs:
      - "\U000F004D"
      - "\U000F0425"
      - "\U000F0493"
      - "\U000F04D3"
      - "\U000F050F"
      - "\U000F0AE0"
      - "\U000F1319"

image:
  # SVG wrapping the La Marzocco mark. Kept as SVG because the ESPHome add-on
  # config dir only accepts text files, and ESPHome detects SVG by sniffing
  # for "<svg" then rasterises it with cairosvg at compile time.
  - file: lamarzocco.svg
    id: img_lm
    type: RGB565
    transparency: alpha_channel
    resize: 184x90

external_components:
  - source:
      type: git
      url: https://github.com/KrX3D/WaveShare-Knob-Esp32S3
      ref: 5e22f98908f758e38f6412e021554d90234bb5ff
    components: [rotary_encoder_custom]

sensor:
  - platform: rotary_encoder_custom
    name: "Knob"
    id: knob
    pin_a: GPIO8
    pin_b: GPIO7
    min_value: -30000
    max_value: 30000
    publish_initial_value: true
    restore_mode: ALWAYS_ZERO
    on_clockwise:
      - if:
          condition:
            lvgl.page.is_showing: page_cfg
          then:
            - script.execute:
                id: cfg_move
                delta: 1
          else:
            - script.execute: knob_tick
    on_anticlockwise:
      - if:
          condition:
            lvgl.page.is_showing: page_cfg
          then:
            - script.execute:
                id: cfg_move
                delta: -1
          else:
            - script.execute: knob_tick

  - platform: homeassistant
    id: coffee_temp
    entity_id: $micra_temp
    internal: true
    on_value:
      - lambda: 'if (!id(cfg_edit)) id(coffee_temp_val) = x;'
      - script.execute: paint_cfg

text_sensor:
  - platform: homeassistant
    id: coffee_ready_txt
    entity_id: sensor.la_minea_micra_coffee_boiler_ready_time
    internal: true
    on_value:
      - script.execute: paint_main
      - script.execute: check_steam

  - platform: homeassistant
    id: steam_ready_txt
    entity_id: sensor.la_minea_micra_steam_boiler_ready_time
    internal: true
    on_value:
      - script.execute: check_steam

  - platform: homeassistant
    id: steam_level_txt
    entity_id: $micra_steam_level
    internal: true
    on_value:
      - lambda: |-
          int v = atoi(x.c_str());
          if (v >= 1 && v <= 3) id(steam_level_val) = v;
      - script.execute: paint_cfg

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Connection Status"

  - platform: gpio
    name: "Knob Button (probe)"
    id: gpio0_probe
    entity_category: diagnostic
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
    on_press:
      - logger.log: "PROBE: GPIO0 went active - there IS a button on this line"

  - platform: homeassistant
    id: micra_on
    name: "Micra Power (mirror)"
    entity_category: diagnostic
    entity_id: $micra_power
    on_state:
      - script.execute: paint_main

  - platform: homeassistant
    id: steam_on
    name: "Steam Boiler (mirror)"
    entity_category: diagnostic
    entity_id: $micra_steam
    on_state:
      - script.execute: paint_cfg

  - platform: homeassistant
    id: micra_brewing
    name: "Micra Brewing (mirror)"
    entity_category: diagnostic
    entity_id: $micra_brewing
    on_press:
      - lambda: |-
          id(shot_ds) = 0;
          id(shot_running) = true;
      - lvgl.arc.update:
          id: arc_shot
          value: 0
      - lvgl.label.update:
          id: lbl_shot_time
          text: "0.0"
      - light.turn_on: back_light
      - script.execute: screentime
      - lvgl.page.show: page_shot
      - script.execute:
          id: haptic
          effect: 1
    on_release:
      - lambda: 'id(shot_running) = false;'
      - script.execute:
          id: haptic
          effect: 1
      - delay: 5s
      - lvgl.page.show: page_main
      - script.execute: paint_main

globals:
  - id: shot_ds
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: shot_running
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: cfg_i
    type: int
    restore_value: false
    initial_value: '0'
  - id: cfg_edit
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: steam_level_val
    type: int
    restore_value: false
    initial_value: '2'
  - id: coffee_temp_val
    type: float
    restore_value: false
    initial_value: '93.0f'
  # The La Marzocco integration reports optimistically, fails over Bluetooth
  # and rolls back, so its state bounces for ~3s after any command. Hold our
  # own intent over that window so the display does not flicker.
  - id: power_pending
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: power_want
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: steaming
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: main_txt
    type: std::string
    restore_value: false
    initial_value: '"..."'
  - id: main_txt_c
    type: uint32_t
    restore_value: false
    initial_value: '0x505050'
  - id: main_ring_c
    type: uint32_t
    restore_value: false
    initial_value: '0x1E1E1E'
  - id: main_icon_c
    type: uint32_t
    restore_value: false
    initial_value: '0x3A3A3A'

# --- Haptics: DRV2605 driven directly over I2C ---
# The RAR external component is deliberately not used: its setup() reads a
# status register this chip NACKs, so it bailed before setting LRA mode and
# library 6. Writes work fine, so the registers are driven here.
script:
  - id: haptic_init
    then:
      - lambda: |-
          const uint8_t addr = 0x5A;
          uint8_t mode_run[2] = {0x01, 0x00};
          uint8_t feedback[2] = {0x1A, 0x80};
          uint8_t library[2]  = {0x03, 0x06};
          auto e1 = id(ic_bus)->write(addr, mode_run, 2);
          auto e2 = id(ic_bus)->write(addr, feedback, 2);
          auto e3 = id(ic_bus)->write(addr, library, 2);
          ESP_LOGI("haptic", "DRV2605 init (LRA, lib 6): %d %d %d (0 = OK)",
                   (int) e1, (int) e2, (int) e3);

  - id: haptic
    parameters:
      effect: int
    mode: parallel
    max_runs: 6
    then:
      - lambda: |-
          const uint8_t addr = 0x5A;
          uint8_t w1[2] = {0x04, (uint8_t) effect};
          uint8_t w2[2] = {0x05, 0x00};
          uint8_t go[2] = {0x0C, 0x01};
          id(ic_bus)->write(addr, w1, 2);
          id(ic_bus)->write(addr, w2, 2);
          id(ic_bus)->write(addr, go, 2);

  - id: knob_tick
    mode: restart
    then:
      - script.execute:
          id: haptic
          effect: 7
      - light.turn_on: back_light
      - script.execute: screentime
      - lvgl.widget.update:
          id: ring
          border_color: 0xFFFFFF
          border_width: 12
      - delay: 300ms
      - script.execute: paint_main

  - id: screentime
    mode: restart
    then:
      - light.turn_on: back_light
      - delay: $screen_timeout
      - light.turn_off: back_light

  - id: paint_main
    mode: restart
    then:
      - lambda: |-
          bool known = id(micra_on).has_state() || id(power_pending);
          bool on = id(power_pending) ? id(power_want) : id(micra_on).state;
          auto cv = id(coffee_ready_txt).state;
          bool heating = !cv.empty() && cv != "unavailable" && cv != "unknown";
          const char *txt = "OFF";
          uint32_t ring_c = 0x242424, txt_c = 0x585858, icon_c = 0x3A3A3A;
          if (!known) {
            txt = "...";
            txt_c = 0x505050; ring_c = 0x1E1E1E;
          } else if (on && heating) {
            txt = "HEATING";
            txt_c = 0xFF7A7A; ring_c = 0x8E1116; icon_c = 0x8E1116;
          } else if (on) {
            txt = "READY";
            txt_c = 0xFFFFFF; ring_c = 0xE31E24; icon_c = 0xE31E24;
          }
          id(main_txt) = txt;
          id(main_txt_c) = txt_c;
          id(main_ring_c) = ring_c;
          id(main_icon_c) = icon_c;
      - lvgl.label.update:
          id: lbl_state
          text: !lambda |-
            std::string s = id(main_txt);
            return s;
          text_color: !lambda 'return lv_color_hex(id(main_txt_c));'
      - lvgl.widget.update:
          id: ring
          border_color: !lambda 'return lv_color_hex(id(main_ring_c));'
          border_width: 6

  - id: power_press
    mode: restart
    then:
      - lambda: |-
          id(power_want) = !(id(power_pending) ? id(power_want) : id(micra_on).state);
          id(power_pending) = true;
      - script.execute: paint_main
      - homeassistant.action:
          action: switch.toggle
          data:
            entity_id: $micra_power
      - delay: 6s
      - lambda: 'id(power_pending) = false;'
      - script.execute: paint_main

  # The integration exposes no "steaming" sensor. Inferred: the steam boiler
  # is recovering while the coffee boiler is not, which is what happens when
  # you pull steam. During warm-up BOTH boilers heat, so that is excluded.
  - id: check_steam
    mode: restart
    then:
      - lambda: |-
          auto sv = id(steam_ready_txt).state;
          auto cv = id(coffee_ready_txt).state;
          bool s_heat = !sv.empty() && sv != "unavailable" && sv != "unknown";
          bool c_heat = !cv.empty() && cv != "unavailable" && cv != "unknown";
          id(steaming) = s_heat && !c_heat && !id(shot_running) && id(micra_on).state;
      - if:
          condition:
            lambda: 'return id(steaming) && !id(shot_running);'
          then:
            - light.turn_on: back_light
            - script.execute: screentime
            - lvgl.page.show: page_steam
          else:
            - if:
                condition:
                  lvgl.page.is_showing: page_steam
                then:
                  - lvgl.page.show: page_main
                  - script.execute: paint_main

  - id: cfg_move
    parameters:
      delta: int
    mode: parallel
    max_runs: 8
    then:
      - script.execute:
          id: haptic
          effect: 7
      - light.turn_on: back_light
      - script.execute: screentime
      - lambda: |-
          if (id(cfg_edit)) {
            float t = id(coffee_temp_val) + 0.5f * delta;
            if (t < 85.0f) t = 85.0f;
            if (t > 104.0f) t = 104.0f;
            id(coffee_temp_val) = t;
          } else {
            const int n = 5;
            id(cfg_i) = ((id(cfg_i) + delta) % n + n) % n;
          }
      - if:
          condition:
            lambda: 'return id(cfg_edit);'
          then:
            - script.execute: push_temp
      - script.execute: paint_cfg

  # Debounced: only sends once the knob stops, so a fast spin does not fire
  # twenty service calls at Home Assistant.
  - id: push_temp
    mode: restart
    then:
      - delay: 600ms
      - homeassistant.action:
          action: number.set_value
          data:
            entity_id: $micra_temp
          data_template:
            value: "{{ t }}"
          variables:
            t: !lambda 'return id(coffee_temp_val);'

  - id: cfg_act
    mode: restart
    then:
      - script.execute:
          id: haptic
          effect: 1
      - if:
          condition:
            lambda: 'return id(cfg_i) == 0;'
          then:
            - homeassistant.action:
                action: switch.toggle
                data:
                  entity_id: $micra_steam
      - if:
          condition:
            lambda: 'return id(cfg_i) == 1;'
          then:
            - lambda: |-
                int lv = id(steam_level_val) + 1;
                if (lv > 3) lv = 1;
                id(steam_level_val) = lv;
            - homeassistant.action:
                action: select.select_option
                data:
                  entity_id: $micra_steam_level
                data_template:
                  option: "{{ lv }}"
                variables:
                  lv: !lambda 'return id(steam_level_val);'
      - if:
          condition:
            lambda: 'return id(cfg_i) == 2;'
          then:
            - lambda: 'id(cfg_edit) = !id(cfg_edit);'
      - if:
          condition:
            lambda: 'return id(cfg_i) == 4;'
          then:
            - lambda: 'id(cfg_edit) = false;'
            - lvgl.page.show: page_main
            - script.execute: paint_main
      - script.execute: paint_cfg

  - id: paint_cfg
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(cfg_edit);'
          then:
            - lvgl.widget.update:
                id: ring_cfg
                border_color: 0xFFFFFF
                border_width: 10
          else:
            - lvgl.widget.update:
                id: ring_cfg
                border_color: 0xE31E24
                border_width: 6
      - if:
          condition:
            lambda: 'return id(cfg_i) == 0;'
          then:
            - lvgl.label.update:
                id: lbl_cfg_icon
                text: "\U000F1319"
            - lvgl.label.update:
                id: lbl_cfg_name
                text: "STEAM BOILER"
            - lvgl.label.update:
                id: lbl_cfg_value
                text: !lambda |-
                  std::string s = id(steam_on).state ? "ON" : "OFF";
                  return s;
            - lvgl.label.update:
                id: lbl_cfg_hint
                text: "tap to toggle"
      - if:
          condition:
            lambda: 'return id(cfg_i) == 1;'
          then:
            - lvgl.label.update:
                id: lbl_cfg_icon
                text: "\U000F04D3"
            - lvgl.label.update:
                id: lbl_cfg_name
                text: "STEAM LEVEL"
            - lvgl.label.update:
                id: lbl_cfg_value
                text: !lambda |-
                  static char b[4];
                  snprintf(b, sizeof(b), "%d", id(steam_level_val));
                  return b;
            - lvgl.label.update:
                id: lbl_cfg_hint
                text: "tap to cycle 1-3"
      - if:
          condition:
            lambda: 'return id(cfg_i) == 2;'
          then:
            - lvgl.label.update:
                id: lbl_cfg_icon
                text: "\U000F050F"
            - lvgl.label.update:
                id: lbl_cfg_name
                text: "COFFEE TEMP"
            - lvgl.label.update:
                id: lbl_cfg_value
                text: !lambda |-
                  static char b[10];
                  snprintf(b, sizeof(b), "%.1f", id(coffee_temp_val));
                  return b;
            - lvgl.label.update:
                id: lbl_cfg_hint
                text: !lambda |-
                  std::string s = id(cfg_edit) ? "turn to set, tap to save"
                                               : "tap to adjust";
                  return s;
      - if:
          condition:
            lambda: 'return id(cfg_i) == 3;'
          then:
            - lvgl.label.update:
                id: lbl_cfg_icon
                text: "\U000F0AE0"
            - lvgl.label.update:
                id: lbl_cfg_name
                text: "BACKFLUSH"
            - lvgl.label.update:
                id: lbl_cfg_value
                text: "CLEAN"
            - lvgl.label.update:
                id: lbl_cfg_hint
                text: "HOLD to start"
      - if:
          condition:
            lambda: 'return id(cfg_i) == 4;'
          then:
            - lvgl.label.update:
                id: lbl_cfg_icon
                text: "\U000F004D"
            - lvgl.label.update:
                id: lbl_cfg_name
                text: "BACK"
            - lvgl.label.update:
                id: lbl_cfg_value
                text: ""
            - lvgl.label.update:
                id: lbl_cfg_hint
                text: "tap to exit"

  - id: paint_shot
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_shot_time
          text: !lambda |-
            static char b[12];
            snprintf(b, sizeof(b), "%u.%u", (unsigned) (id(shot_ds) / 10),
                     (unsigned) (id(shot_ds) % 10));
            return b;
      - lvgl.arc.update:
          id: arc_shot
          value: !lambda 'return (float) id(shot_ds);'

interval:
  - interval: 100ms
    then:
      - if:
          condition:
            lambda: 'return id(shot_running);'
          then:
            - lambda: 'id(shot_ds) += 1;'
            - script.execute: paint_shot

# =============================================================================
# UI - 360x360 round
# =============================================================================
lvgl:
  id: my_lvgl
  displays: [main_display]
  touchscreens:
    - touchscreen_id: my_touchscreen
      long_press_time: 700ms
  color_depth: 16
  buffer_size: 24%
  bg_color: 0x000000
  # USB-C end is the top when plugged in for power. mipi_spi reports hardware
  # rotation, so LVGL does this in the panel, not on the CPU.
  rotation: 180
  pages:
    # ---------------- MAIN ----------------
    - id: page_main
      bg_color: 0x000000
      # No hidden gestures here. Everything is a visible, tappable target.
      widgets:
        - obj:
            id: ring
            align: CENTER
            width: 348
            height: 348
            radius: 174
            bg_opa: TRANSP
            border_width: 6
            border_color: 0x242424
            pad_all: 0
            # LVGL sets CLICKABLE on obj by default; this one is full-screen
            # so leaving it clickable swallows every touch.
            clickable: false
            scrollable: false
        - image:
            id: img_logo
            src: img_lm
            align: CENTER
            y: -96
        - label:
            id: lbl_state
            text: "..."
            text_font: montserrat_48
            text_color: 0x585858
            align: CENTER
            y: -18
        - button:
            id: btn_power
            align: CENTER
            x: -62
            y: 86
            width: 78
            height: 78
            radius: 39
            bg_color: 0x141414
            border_width: 2
            border_color: 0x3A3A3A
            on_short_click:
              - script.execute:
                  id: haptic
                  effect: 1
              - script.execute: screentime
              - script.execute: power_press
            widgets:
