    # ---------------- CONTROL ----------------
    - id: page_cfg
      bg_color: 0x000000
      on_short_click:
        - script.execute: cfg_act
      on_long_press:
        - if:
            condition:
              lambda: 'return id(cfg_i) == 3;'
            then:
              - logger.log: "CFG: starting backflush"
              - script.execute:
                  id: haptic
                  effect: 1
              - homeassistant.action:
                  action: button.press
                  data:
                    entity_id: $micra_backflush
            else:
              - script.execute:
                  id: haptic
                  effect: 1
              - lambda: 'id(cfg_edit) = false;'
              - lvgl.page.show: page_main
              - script.execute: paint_main
      widgets:
        - obj:
            id: ring_cfg
            align: CENTER
            width: 348
            height: 348
            radius: 174
            bg_opa: TRANSP
            border_width: 6
            border_color: 0xE31E24
            pad_all: 0
            clickable: false
            scrollable: false
        - label:
            id: lbl_cfg_icon
            text: "\U000F1319"
            text_font: mdi_40
            text_color: 0xE31E24
            align: CENTER
            y: -96
        - label:
