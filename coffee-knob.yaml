    # ---------------- SHOT ----------------
    - id: page_shot
      bg_color: 0x000000
      # This page used to be a dead end: no gesture left it, so a slow
      # grinder record read as a hang. It leaves on a gesture now -- but a
      # capacitive panel sitting next to a steam wand picks up splashes and
      # sleeves, and a stray tap must not throw away a shot you are watching.
      # So while the timer is LIVE only a deliberate hold leaves; once
      # extraction ends a tap is enough. The hint says which.
      on_short_click:
        - if:
            condition:
              lambda: 'return !id(shot_running);'
            then:
              - script.execute: go_main
      on_long_press:
        - script.execute: go_main
      widgets:
        - arc:
            id: arc_shot
            align: CENTER
            width: 344
            height: 344
            start_angle: 270
            end_angle: 268
            min_value: 0
            max_value: $shot_full_scale_ds
            value: 0
            adjustable: false
            arc_width: 14
            arc_color: 0x2A0A0C
            indicator:
              arc_width: 14
              arc_color: 0xE31E24
        # Blank unless this shot is on non-hopper beans, so it is only ever
        # present when it means something.
        - label:
            id: lbl_shot_beans
            text: ""
            text_font: montserrat_16
            text_color: 0xE8A33D
            align: CENTER
            y: -112
        - label:
            id: lbl_shot_label
            text: "SHOT"
            text_font: montserrat_20
            text_color: 0xB05055
            align: CENTER
            y: -86
        - label:
            id: lbl_shot_time
            text: "0.0"
            text_font: montserrat_48
            text_color: 0xFFFFFF
            align: CENTER
            y: 0
        - label:
            id: lbl_shot_unit
            text: "seconds"
            text_font: montserrat_16
            text_color: 0x4A4A4A
            align: CENTER
            y: 86
        # Switches between "hold" and "tap" so the gesture on offer is never
        # a guess -- see the page's on_short_click for why they differ.
        - label:
            id: lbl_shot_hint
            text: "tap to leave"
            text_font: montserrat_16
            text_color: 0x3A3A3A
            align: CENTER
            y: 120
