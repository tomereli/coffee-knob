# =============================================================================
# coffee-knob - Waveshare ESP32-S3-Knob-Touch-LCD-1.8 / Guition JC3636K518C
#
# PROVENANCE - hardware values verbatim from KrX3D/WaveShare-Knob-Esp32S3
# @ 5e22f98, cross-checked against the board schematic. No pin invented.
#   Display QSPI: CLK 13, D0-3 15/16/17/18, CS 14, RST 21   (ST77916)
#   Touch  I2C:   SDA 11, SCL 12, INT 9, RST 10             (CST816D @ 0x15)
#   Haptic I2C:   same bus, DRV2605 @ 0x5A, EN strapped 3V3, TRIG to GND
#   Knob EC1:     A GPIO8, B GPIO7  (EC2 is on the OTHER MCU - not used)
#   Backlight:    GPIO47 (PWM)
#
# MDI glyphs are stored as literal characters, never as backslash escapes.
# Escapes do not survive being written through the dashboard API -- the
# backslash gets doubled in transit and ESPHome then reports a duplicate
# glyph. Keep this file free of backslashes entirely.
#
# INTERACTION MODEL
#   turn:     walk the card carousel, wrapping both ways
#               MACHINE - SHOT - GRINDER - CARE - BOILERS
#   main:     tap the buttons (there is no long press on this card)
#   cards:    short tap -> back to MACHINE
#   control:  turn -> move / adjust           short tap -> act
#             long press -> back to main, EXCEPT on two items:
#               BACKFLUSH  hold starts the cycle
#               BEANS      hold saves the machine settings on screen into
#                          the slot for the grinder's current recipe
#             twelve items:
#               steam boiler, steam level, coffee temp, target ratio,
#               target time, beans, pre-infusion mode, pre-infusion time,
#               prebrew on, prebrew off, backflush, back
#             TARGET TIME at 0 means "follow the grinder's recipe"; any
#             other value overrides it, because the recipe target can only
#             be changed at the grinder itself.
#   SHOT card: long press -> rate. Three steps, turn to pick, tap to advance,
#             tap again to commit, long press to abandon.
#               1/3 serve  ESPRESSO - MILK
#               2/3 taste  SOUR - SOUR-ISH - BALANCED - BITTER-ISH - BITTER
#               3/3 score  1 - 5
#             Serve comes first because it is the one fact you already know
#             before tasting, and it frames the sour/bitter call rather than
#             trailing it. Committing writes all three to Home Assistant and
#             appends one row to the shot log.
#   shot:     while the timer is LIVE, only a HOLD leaves (a stray tap next
#             to a steam wand must not throw away a shot you are watching).
#             Once extraction ends a tap is enough. Rotation is blocked only
#             while live, and the main card keeps saying the grinder record
#             is still coming.
#   clean:    shown automatically while a backflush runs. Rotation will not
#             navigate away from a running cycle, but a HOLD leaves.
#             There is NO steaming screen -- the machine publishes no such
#             signal and every attempt to infer one was wrong. The boilers
#             card carries the real steam-boiler state instead.
# =============================================================================

# Lets others pull this straight into their ESPHome dashboard (New Device ->
# import from URL). import_full_config gives them the whole editable file so
# they can fix up the substitutions below for their own machine.
dashboard_import:
  package_import_url: github://tomereli/coffee-knob/coffee-knob.yaml@main
  import_full_config: true

substitutions:
  micra_power:       switch.la_minea_micra
  micra_brewing:     binary_sensor.la_minea_micra_brewing_active
  micra_steam:       switch.la_minea_micra_steam_boiler
  micra_steam_level: select.la_minea_micra_steam_level
  micra_temp:        number.la_minea_micra_coffee_target_temperature
  micra_backflush:   button.la_minea_micra_start_backflush
  micra_cleaning:    binary_sensor.la_minea_micra_backflush_active
  micra_preinf_mode: select.la_minea_micra_prebrew_infusion_mode
  micra_preinf_time: number.la_minea_micra_preinfusion_time
  micra_prebrew_on:  number.la_minea_micra_prebrew_on_time
  micra_prebrew_off: number.la_minea_micra_prebrew_off_time
  # La Marzocco ask for a backflush daily, so hours is the primary axis and
  # shots is the secondary one -- a quiet day and a heavy day are not the
  # same amount of dirt. Whichever crosses first wins.
  clean_warn_shots:  "20"
  clean_due_shots:   "35"
  # Machine-measured: paddle window ~15 s, full cycle ~90 s from the ON edge.
  clean_arm_ds:      "160"
  clean_total_ds:    "900"
  screen_timeout:    5min
  # How long after the backlight comes up a press is treated as "wake only".
  wake_guard_ms:     "600"
  shot_full_scale_ds: "400"

esphome:
  name: coffee-knob
  friendly_name: "Coffee Knob"
  comment: "La Marzocco Micra knob"
  # Required by dashboard_import above -- without it ESPHome rejects the
  # whole config. Format is namespace.name.
  project:
    name: "tomereli.coffee-knob"
    version: "1.0.0"
  platformio_options:
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L
  on_boot:
    - priority: -100
      then:
        - delay: 2s
        - script.execute: haptic_init
        - light.turn_on:
            id: back_light
            brightness: 60%
        - script.execute: screentime
        - script.execute: paint_main

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  encryption:
    key: !secret coffee_knob_api_key
  on_client_connected:
    - delay: 2s
    - script.execute: paint_main

ota:
  - platform: esphome
    password: !secret coffee_knob_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Coffee Knob Fallback"
    password: !secret coffee_knob_ap_password

captive_portal:

# --- Display: ST77916 over QSPI ---
# rotation lives on the lvgl: block. LVGL rejects display-level rotation and
# rotates touch input itself via rotate_coordinates().
spi:
  id: display_qspi
  type: quad
  clk_pin: 13
  data_pins: [15, 16, 17, 18]

display:
  - platform: mipi_spi
    id: main_display
    model: JC3636W518V2
    data_rate: 80MHz
    color_order: rgb
    rotation: 0
    cs_pin: 14
    reset_pin: 21
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
    dimensions:
      height: 360
      width: 360

i2c:
  sda: 11
  scl: 12
  scan: true
  id: ic_bus

touchscreen:
  - platform: cst816
    id: my_touchscreen
    display: main_display
    interrupt_pin: GPIO9
    reset_pin: GPIO10
    transform:
      mirror_x: false
      mirror_y: false
      swap_xy: false
    on_touch:
      - script.execute: screentime

output:
  - platform: ledc
    pin: GPIO47
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    icon: "mdi:television"
    entity_category: config
    id: back_light
    restore_mode: ALWAYS_ON
    default_transition_length:
      milliseconds: 30
    initial_state:
      brightness: 60%
    on_turn_off:
      - lvgl.pause:
          show_snow: false
    on_turn_on:
      - lvgl.resume:
      # Stamped so the touch that WOKE the screen cannot also act on it.
      # The panel is dark for most of the day; the first press is aimed at
      # a knob you cannot read, and it used to land on whatever happened to
      # be under it -- the power button, a settings item, a rating commit.
      - lambda: 'id(wake_ms) = millis();'

# --- Icons: Material Design Icons webfont ---
# Vector glyphs: they scale and take colour. Fetched at COMPILE time from
# raw.githubusercontent (github.com/.../raw/... is proxy-blocked) and baked
# into the firmware, so nothing is fetched at runtime.
font:
  - file: "https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_40
    size: 40
    bpp: 4
    glyphs:
      - "󰁍"
      - "󰅶"
      - "󰐥"
      - "󰒓"
      - "󰓓"
      - "󰔏"
      - "󰔛"
      - "󰖏"
      - "󰗑"
      - "󰫠"
      - "󱌙"

image:
  # SVG wrapping the La Marzocco mark. Kept as SVG because the ESPHome add-on
  # config dir only accepts text files, and ESPHome detects SVG by sniffing
  # for "<svg" then rasterises it with cairosvg at compile time.
  - file: lamarzocco.svg
    id: img_lm
    type: RGB565
    transparency: alpha_channel
    resize: 124x60

# Needed only to turn the machine's ISO timestamps into "3h ago". HA is
# already the source of truth for everything else here, so borrow its clock
# rather than adding SNTP.
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: refresh_ago

external_components:
  - source:
      type: git
      url: https://github.com/KrX3D/WaveShare-Knob-Esp32S3
      ref: 5e22f98908f758e38f6412e021554d90234bb5ff
    components: [rotary_encoder_custom]

sensor:
  - platform: rotary_encoder_custom
    name: "Knob"
    id: knob
    pin_a: GPIO8
    pin_b: GPIO7
    min_value: -30000
    max_value: 30000
    publish_initial_value: true
    restore_mode: ALWAYS_ZERO
    on_clockwise:
      - if:
          condition:
            lvgl.page.is_showing: page_cfg
          then:
            - script.execute:
                id: cfg_move
                delta: 1
          else:
            - script.execute:
                id: card_move
                delta: 1
    on_anticlockwise:
      - if:
          condition:
            lvgl.page.is_showing: page_cfg
          then:
            - script.execute:
                id: cfg_move
                delta: -1
          else:
            - script.execute:
                id: card_move
                delta: -1

  # --- Mahlkonig Sync: the whole shot record lands as ONE atomic bundle
  # after the shot ends (verified: all six sensors change within 5ms, and
  # yield_weight has a single state change per shot - it does NOT stream).
  - platform: homeassistant
    id: sync_dose
    entity_id: sensor.mahlkonig_e64_ws_dose_weight
    internal: true
  - platform: homeassistant
    id: sync_yield
    entity_id: sensor.mahlkonig_e64_ws_yield_weight
    internal: true
  - platform: homeassistant
    id: sync_time
    entity_id: sensor.mahlkonig_e64_ws_shot_time
    internal: true
  # Disc distance in microns. Grind by Sync rewrites this after every shot
  # from the scale's duration + yield, so the DELTA is the loop working.
  - platform: homeassistant
    id: sync_grind
    entity_id: sensor.mahlkonig_e64_ws_grind_setting
    internal: true

  - platform: homeassistant
    id: sync_gtime
    entity_id: sensor.mahlkonig_e64_ws_grind_time
    internal: true

  # The grinder's own target, so the card can say how far off the dose landed.
  - platform: homeassistant
    id: sync_dose_target
    entity_id: sensor.mahlkonig_e64_ws_dose_target
    internal: true

  - platform: homeassistant
    id: rating_now
    entity_id: input_number.coffee_shot_rating
    internal: true
    on_value:
      - lambda: 'if (!id(rate_mode)) id(rate_val) = (int) x;'

  # Both pickers open on the last value you gave, not on a neutral default.
  # When you are dialling in, the previous verdict is the better prior.
  - platform: homeassistant
    id: taste_now
    entity_id: input_number.coffee_shot_taste
    internal: true
    on_value:
      - lambda: 'if (!id(rate_mode)) id(taste_val) = (int) x;'

  # --- What counts as a good shot.
  # RATIO is genuinely Tomer's own number. Confirmed against the raw Sync API
  # record by the integration session: the recipe holds weightRecipe (dose),
  # dddRecipe (grind setting) and brewTimeRecipe (brew time). There is NO
  # ratio field anywhere -- Mahlkonig targets time and dose, and the ratio is
  # emergent. So nothing upstream has an opinion about 1:1.7 versus 1:2.
  # Target plus tolerance rather than min/max: one number to nudge when
  # taste moves, one to widen when you stop caring.
  - platform: homeassistant
    id: tgt_ratio
    entity_id: input_number.coffee_target_ratio
    internal: true
    on_value:
      - lambda: 'if (!id(cfg_edit)) id(ratio_val) = x;'
      - script.execute: paint_cfg
      - script.execute: paint_result
      - script.execute: paint_main
  - platform: homeassistant
    id: tgt_ratio_tol
    entity_id: input_number.coffee_ratio_tolerance
    internal: true
    on_value:
      - script.execute: paint_result
      - script.execute: paint_main
  # Integration v0.1.1 exposes the recipe's OWN target brew time
  # (grind.payload.brewTimeRecipe = 25000 ms). Subscribed speculatively:
  # while that version is not yet deployed this reads NaN and calc_verdict
  # falls back to the helper below, so the knob starts using the real recipe
  # target the moment it appears -- no reflash. Only the CENTRE comes from
  # Sync; the tolerance stays Tomer's, because Mahlkonig has no opinion about
  # how close is close enough.
  - platform: homeassistant
    id: mk_time_target
    entity_id: sensor.mahlkonig_e64_ws_brew_time_target
    internal: true
    on_value:
      - script.execute: paint_result
      - script.execute: paint_main
  - platform: homeassistant
    id: tgt_time
    entity_id: input_number.coffee_target_shot_time
    internal: true
    on_value:
      - lambda: 'if (!id(cfg_edit)) id(tgt_time_val) = x;'
      - script.execute: paint_result
      - script.execute: paint_main
      - script.execute: paint_cfg
  - platform: homeassistant
    id: tgt_time_tol
    entity_id: input_number.coffee_shot_time_tolerance
    internal: true
    on_value:
      - script.execute: paint_result
      - script.execute: paint_main

  # Roast age, computed in HA from the bean's roast date. Numeric so the
  # card can print it; the window word below turns it into advice.
  - platform: homeassistant
    id: roast_d
    entity_id: sensor.coffee_days_since_roast
    internal: true
    on_value:
      - script.execute: paint_grind

  - platform: homeassistant
    id: total_shots
    entity_id: sensor.la_minea_micra_total_coffees_made
    internal: true
    on_value:
      - script.execute: paint_care

  # Paired with total_shots this is cleaning discipline over the life of the
  # machine, which is the honest version of "am I looking after this thing".
  - platform: homeassistant
    id: total_flushes
    entity_id: sensor.la_minea_micra_total_flushes_done
    internal: true
    on_value:
      - script.execute: paint_care

  - platform: homeassistant
    id: coffee_temp
    entity_id: $micra_temp
    internal: true
    on_value:
      - lambda: 'if (!id(cfg_edit)) id(coffee_temp_val) = x;'
      - script.execute: paint_cfg
      - script.execute: paint_boil

  # The prebrew pair. Live only while the mode is 'prebrew'; NaN otherwise,
  # which is why every read is guarded the same way preinf_time is.
  - platform: homeassistant
    id: prebrew_on
    entity_id: $micra_prebrew_on
    internal: true
    on_value:
      - lambda: |-
          if (!id(cfg_edit) && !std::isnan(x)) id(prebrew_on_val) = x;
      - script.execute: paint_cfg

  - platform: homeassistant
    id: prebrew_off
    entity_id: $micra_prebrew_off
    internal: true
    on_value:
      - lambda: |-
          if (!id(cfg_edit) && !std::isnan(x)) id(prebrew_off_val) = x;
      - script.execute: paint_cfg

  # total_coffees_made never resets, so shots-since-clean needs a baseline
  # recorded at each backflush. An HA automation writes it; see the CARE card.
  - platform: homeassistant
    id: shots_base
    entity_id: input_number.coffee_shots_at_last_clean
    internal: true
    on_value:
      - script.execute: paint_care
      - script.execute: paint_main

  # The grinder reports WHICH cloud recipe is loaded, but never its name --
  # the app has no rename. The index is the only handle there is, so it is
  # what the per-bean presets are keyed on.
  - platform: homeassistant
    id: recipe_idx
    entity_id: sensor.mahlkonig_e64_ws_recipe_index
    internal: true
    on_value:
      - lambda: |-
          if (std::isnan(x)) return;
          int i = (int) x;
          if (i >= 0 && i <= 2) id(recipe_i) = i;
      - script.execute: preset_apply
      - script.execute: paint_grind

  # Goes unavailable whenever the mode is not 'preinfusion', so a NaN here
  # means "not applicable" rather than zero -- keep the last good value so
  # the card does not flash 0.0s every time the mode changes.
  - platform: homeassistant
    id: preinf_time
    entity_id: $micra_preinf_time
    internal: true
    on_value:
      - lambda: |-
          if (!id(cfg_edit) && !std::isnan(x)) id(preinf_time_val) = x;
      - script.execute: paint_cfg

  # --- Battery ---
  # The board does have an MX1.25 li-po socket and a charge-management IC,
  # and system voltage reaches the MCU on GPIO1 (ADC1_CH0) behind a 2:1
  # divider. Two independent sources agree on the pin: Waveshare's own
  # 01_ADC_Test demo reads "ADC1 channel 0", and KrX3D's config for this
  # exact board uses GPIO1.
  # HONEST LIMIT: no charge-status line is broken out to any GPIO, so
  # "charging" is not observable -- it can only be inferred from voltage,
  # and a charged pack on USB looks identical to no pack at all. With no
  # battery fitted this simply reads the USB rail and sits there.
  - platform: adc
    pin: GPIO1
    id: batt_v
    name: "Supply Voltage"
    entity_category: diagnostic
    attenuation: 12db
    update_interval: 10s
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - multiply: 2.0
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 2
    on_value:
      - component.update: batt_level

  - platform: template
    id: batt_level
    name: "Battery"
    device_class: battery
    entity_category: diagnostic
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      float v = id(batt_v).state;
      if (std::isnan(v) || std::isinf(v)) return NAN;
      return v;
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 3.00 -> 0.0
            - 3.50 -> 10.0
            - 3.65 -> 30.0
            - 3.75 -> 50.0
            - 3.90 -> 70.0
            - 4.10 -> 90.0
            - 4.20 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100
    on_value:
      - lambda: 'id(batt_pct) = std::isnan(x) ? -1 : (int) roundf(x);'

text_sensor:
  - platform: homeassistant
    id: coffee_ready_txt
    entity_id: sensor.la_minea_micra_coffee_boiler_ready_time
    internal: true
    on_value:
      - script.execute: paint_main
      - script.execute: paint_boil

  - platform: homeassistant
    id: steam_ready_txt
    entity_id: sensor.la_minea_micra_steam_boiler_ready_time
    internal: true
    on_value:
      - script.execute: paint_boil

  - platform: homeassistant
    id: sync_quality
    entity_id: sensor.mahlkonig_e64_ws_shot_quality
    internal: true

  # Mahlkonig's OWN verdict on brew time, against its own recipe target --
  # OK / OFF_BELOW (too fast) / OFF_ABOVE (too slow). Strictly better than
  # comparing shot_time to a target myself: no tolerance to keep tuned, and
  # it cannot disagree with the machine because it IS the machine. The local
  # band survives only as a fallback for when this is not being published.
  - platform: homeassistant
    id: mk_time_quality
    entity_id: sensor.mahlkonig_e64_ws_shot_quality_brew_time
    internal: true
    on_value:
      - script.execute: paint_result
      - script.execute: paint_main

  # Every grind event carries a fresh UUID, so this is the one trigger that
  # cannot miss a shot or fire twice for the same one.
  - platform: homeassistant
    id: shot_uuid
    entity_id: sensor.mahlkonig_e64_ws_dose_weight
    attribute: grind_event_uuid
    internal: true

  - platform: homeassistant
    id: last_clean_txt
    entity_id: sensor.la_minea_micra_last_cleaning_time
    internal: true
    on_value:
      - script.execute: refresh_ago

  - platform: homeassistant
    id: last_grind_txt
    entity_id: sensor.mahlkonig_e64_ws_last_grind
    internal: true
    on_value:
      - script.execute: refresh_ago
      # THIS is the trigger for a finished shot, not grind_event_uuid.
      # The UUID changes when you GRIND -- minutes before the shot exists --
      # so firing on it painted the previous shot's yield every time.
      # Measured 8 Aug: grind 08:14:03, shot 08:16:53-08:17:31, bundle
      # (dose, yield, time, quality, this timestamp) all landed 08:17:52.
      #
      # A NEW SHOT IS A NEW VALUE, not another delivery of the same one.
      # The old guard was a bare "have I seen anything yet" latch, which is
      # wrong: Home Assistant re-sends every subscribed state on reconnect,
      # and reloading an integration recreates its entities (unavailable ->
      # value). Either fires on_value again with an UNCHANGED timestamp.
      # Measured 8 Aug: the Sync integration was redeployed, last_grind was
      # recreated at 11:22:32 still holding the 10:04 record, and the knob
      # pinned itself on the result card -- shot_result is mode: restart, so
      # each phantom re-trigger reset its 60 s auto-return and the screen
      # never left. Compare the value; ignore placeholders.
      - lambda: |-
          id(grind_is_new) = false;
          if (!x.empty() && x != "unavailable" && x != "unknown") {
            if (!id(uuid_seen)) {
              // First real value after boot only tells us where we are.
              id(uuid_seen) = true;
              id(last_grind_seen) = x;
            } else if (x != id(last_grind_seen)) {
              id(last_grind_seen) = x;
              id(grind_is_new) = true;
            }
          }
      - if:
          condition:
            lambda: 'return id(grind_is_new);'
          then:
            - script.execute: shot_result

  # Opens on whatever was chosen last, like the other two pickers -- people go
  # through espresso phases and milk phases, so the previous answer is the
  # better prior.
  - platform: homeassistant
    id: served_txt
    entity_id: input_select.coffee_served_as
    internal: true
    on_value:
      - lambda: 'if (!id(rate_mode)) id(serve_i) = (x == "Milk") ? 1 : 0;'

  - platform: homeassistant
    id: window_txt
    entity_id: sensor.coffee_brew_window
    internal: true
    on_value:
      - script.execute: paint_grind

  # The bean names are HA input_select options and are NOT all renderable
  # here: one of them is Hebrew, and the LVGL montserrat fonts carry ASCII
  # only. Rather than draw a row of empty boxes, reduce each name to what
  # this display can honestly show and say so when nothing is left. Done
  # once per change into a global, not per paint.
  - platform: homeassistant
    id: beans_hop_txt
    entity_id: input_select.coffee_current_beans
    internal: true
    on_value:
      - lambda: |-
          // The bean list lives in Home Assistant and may hold any script;
          // this display draws ASCII and nothing else. Reduce rather than
          // mangle: non-ASCII bytes collapse to one space, runs of space
          // collapse to one, and a name with fewer than two Latin letters
          // left is reported as unprintable instead of drawn as debris.
          std::string out;
          int letters = 0;
          bool gap = false;
          for (size_t i = 0; i < x.size(); i++) {
            unsigned char ch = (unsigned char) x[i];
            if (ch < 32 || ch > 126 || ch == ' ') { gap = true; continue; }
            if (!out.empty() && gap) out += ' ';
            gap = false;
            out += (char) ch;
            if ((ch >= 'A' && ch <= 'Z') || (ch >= 'a' && ch <= 'z')) letters++;
          }
          if (letters < 2) out = "non-latin name";
          if (out.size() > 24) {
            size_t cut = out.rfind(' ', 24);
            out = out.substr(0, (cut == std::string::npos || cut < 8) ? 24 : cut);
          }
          id(beans_hop_ascii) = out;
      - script.execute: paint_grind
      - script.execute: paint_cfg

  - platform: homeassistant
    id: beans_shot_txt
    entity_id: input_select.coffee_beans_for_this_shot
    internal: true
    on_value:
      - lambda: |-
          id(beans_override) = !x.empty() && x != "Same as hopper"
                               && x != "unavailable" && x != "unknown";
          // The bean list lives in Home Assistant and may hold any script;
          // this display draws ASCII and nothing else. Reduce rather than
          // mangle: non-ASCII bytes collapse to one space, runs of space
          // collapse to one, and a name with fewer than two Latin letters
          // left is reported as unprintable instead of drawn as debris.
          std::string out;
          int letters = 0;
          bool gap = false;
          for (size_t i = 0; i < x.size(); i++) {
            unsigned char ch = (unsigned char) x[i];
            if (ch < 32 || ch > 126 || ch == ' ') { gap = true; continue; }
            if (!out.empty() && gap) out += ' ';
            gap = false;
            out += (char) ch;
            if ((ch >= 'A' && ch <= 'Z') || (ch >= 'a' && ch <= 'z')) letters++;
          }
          if (letters < 2) out = "non-latin name";
          if (out.size() > 24) {
            size_t cut = out.rfind(' ', 24);
            out = out.substr(0, (cut == std::string::npos || cut < 8) ? 24 : cut);
          }
          id(beans_shot_ascii) = out;
      - script.execute: paint_shot_beans

  - platform: homeassistant
    id: steam_level_txt
    entity_id: $micra_steam_level
    internal: true
    on_value:
      - lambda: |-
          int v = atoi(x.c_str());
          if (v >= 1 && v <= 3) id(steam_level_val) = v;
      - script.execute: paint_cfg
      - script.execute: paint_boil

  # 0 disabled / 1 prebrew / 2 preinfusion -- the order the select reports.
  - platform: homeassistant
    id: preinf_mode_txt
    entity_id: $micra_preinf_mode
    internal: true
    on_value:
      - lambda: |-
          if      (x == "disabled")    id(preinf_mode_val) = 0;
          else if (x == "prebrew")     id(preinf_mode_val) = 1;
          else if (x == "preinfusion") id(preinf_mode_val) = 2;
      - script.execute: paint_cfg

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Connection Status"

  - platform: homeassistant
    id: micra_on
    name: "Micra Power (mirror)"
    entity_category: diagnostic
    entity_id: $micra_power
    on_state:
      - script.execute: paint_main
      - script.execute: paint_boil

  - platform: homeassistant
    id: steam_on
    name: "Steam Boiler (mirror)"
    entity_category: diagnostic
    entity_id: $micra_steam
    on_state:
      - script.execute: paint_cfg
      - script.execute: paint_boil

  - platform: homeassistant
    id: water_empty
    entity_id: binary_sensor.la_minea_micra_water_tank_empty
    internal: true
    on_state:
      - script.execute: paint_care

  - platform: homeassistant
    id: micra_brewing
    name: "Micra Brewing (mirror)"
    entity_category: diagnostic
    entity_id: $micra_brewing
    on_press:
      - lambda: |-
          id(shot_ds) = 0;
          id(shot_t0) = millis();
          id(shot_running) = true;
          id(waiting_shot) = false;
          id(wait_ds) = 0;
      - lvgl.arc.update:
          id: arc_shot
          value: 0
      - lvgl.label.update:
          id: lbl_shot_time
          text: "0.0"
      # Reset the subtitle: it gets repurposed as the waiting indicator once
      # extraction ends, so a second shot must not start out saying that.
      - lvgl.label.update:
          id: lbl_shot_unit
          text: "seconds"
          text_color: 0x4A4A4A
      # A live timer is protected from stray taps; say so.
      - lvgl.label.update:
          id: lbl_shot_hint
          text: "hold to leave"
      - script.execute: paint_shot_beans
      - light.turn_on: back_light
      - script.execute: screentime
      - lvgl.page.show: page_shot
      - script.execute:
          id: haptic
          effect: 1
    on_release:
      - lambda: 'id(shot_running) = false;'
      # Extraction is over, so a plain tap is safe again.
      - lvgl.label.update:
          id: lbl_shot_hint
          text: "tap to leave"
      - script.execute:
          id: haptic
          effect: 1
      # Under 10 s that was a flush, not a shot. Measured 8 Aug: flush ran
      # 5 s (08:15:23-28), the real shot 38 s (08:16:53-08:17:31). A flush
      # produces no grind record, so nothing downstream needs telling --
      # just get off the timer without pretending a shot happened.
      - if:
          condition:
            lambda: 'return id(shot_ds) < 100;'
          then:
            - if:
                condition:
                  lvgl.page.is_showing: page_shot
                then:
                  - script.execute: go_main
          else:
            # MEASURED 8 Aug: the bundle landed 21 s after one shot and 91 s
            # after the next. The old fixed 60 s hold therefore gave up 32 s
            # early, and said nothing at all while it waited -- which read as
            # a frozen screen. The wait is now open-ended and visible:
            # paint_wait animates it, the 100 ms interval times it out at
            # 3 min, and shot_result ends it the moment data lands. A tap or
            # a turn leaves at any point.
            - lambda: |-
                id(waiting_shot) = true;
                id(wait_ds) = 0;
            - script.execute: paint_wait
            - script.execute: paint_main

  # The machine's own view of the clean cycle. This is authoritative -- the
  # button press only asks; this sensor says what actually happened.
  - platform: homeassistant
    id: micra_cleaning
    name: "Micra Cleaning (mirror)"
    entity_category: diagnostic
    entity_id: $micra_cleaning
    on_press:
      - lambda: |-
          id(clean_ds) = 0;
          id(clean_running) = true;
          id(clean_confirmed) = true;
      - light.turn_on: back_light
      - script.execute: screentime
      - script.execute: paint_clean
      - lvgl.page.show: page_clean
      - script.execute:
          id: haptic
          effect: 1
    on_release:
      - lambda: 'id(clean_running) = false;'
      - script.execute: finish_clean

globals:
  - id: shot_ds
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # The millis() stamp the stopwatch is derived from. Counting interval ticks
  # read LOW under display load, and that number is what got logged.
  - id: shot_t0
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # millis() at the moment the backlight came up. Anything within the guard
  # window after it is treated as "wake only". Unsigned arithmetic, so the
  # 49-day millis() wrap is harmless.
  - id: wake_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: shot_running
    type: bool
    restore_value: false
    initial_value: 'false'
  # True from the end of a real extraction until the Sync bundle lands.
  # MEASURED: the bundle is not punctual. 8 Aug 08:17 it arrived 21 s after
  # the paddle closed; 8 Aug 09:59 it took 91 s. A fixed delay cannot cover
  # both, so nothing is timed against a guess any more -- the screen says it
  # is waiting, and shot_result is what ends the wait.
  - id: waiting_shot
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: wait_ds
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: cfg_i
    type: int
    restore_value: false
    initial_value: '0'
  - id: cfg_edit
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: steam_level_val
    type: int
    restore_value: false
    initial_value: '2'
  - id: coffee_temp_val
    type: float
    restore_value: false
    initial_value: '93.0f'
  # Local editable copy of the target ratio, same pattern as coffee_temp_val:
  # held while the knob is turning so the display does not fight the
  # round-trip, pushed to HA once the knob stops.
  - id: ratio_val
    type: float
    restore_value: false
    initial_value: '1.80f'
  # Machine pre-infusion: mode is the select, time only applies in
  # 'preinfusion' mode (prebrew uses its own on/off pair instead).
  - id: preinf_mode_val
    type: int
    restore_value: false
    initial_value: '2'
  - id: preinf_time_val
    type: float
    restore_value: false
    initial_value: '8.0f'
  - id: prebrew_on_val
    type: float
    restore_value: false
    initial_value: '3.0f'
  - id: prebrew_off_val
    type: float
    restore_value: false
    initial_value: '3.0f'
  # 0 means "follow the Mahlkonig recipe". Any other value overrides it --
  # the grinder's target can only be changed from the grinder, so this is
  # the only way to aim at a different time from the machine side.
  - id: tgt_time_val
    type: float
    restore_value: false
    initial_value: '0.0f'
  - id: shots_since_clean
    type: int
    restore_value: false
    initial_value: '-1'
  - id: recipe_i
    type: int
    restore_value: false
    initial_value: '0'
  # Per-recipe presets, indexed by recipe_i. Kept in flash rather than in
  # Home Assistant so a preset survives a restart of either side, and so
  # saving one is a gesture on the knob rather than a trip to a dashboard.
  # 0 in a slot means "never saved" and apply skips it.
  - id: preset_temp
    type: float[3]
    restore_value: true
    initial_value: '{0.0f, 0.0f, 0.0f}'
  - id: preset_ratio
    type: float[3]
    restore_value: true
    initial_value: '{0.0f, 0.0f, 0.0f}'
  - id: preset_preinf
    type: float[3]
    restore_value: true
    initial_value: '{0.0f, 0.0f, 0.0f}'
  # The La Marzocco integration reports optimistically and rolls back if the
  # command fails, so its state bounces for a few seconds after anything we
  # send. Hold our own intent over that window so the display does not
  # flicker -- and so a second press reads our intent, not the stale mirror.
  - id: power_pending
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: power_want
    type: bool
    restore_value: false
    initial_value: 'false'
  # --- backflush / clean ---
  # Timeline read off the machine: backflush_active goes ON the moment the
  # command lands, which starts a 15 s window to move the paddle. Ignore it
  # and it drops OFF at ~13-15 s. Move the paddle and it stays ON for the
  # full ~90 s cycle, then drops and last_cleaning_time updates. So elapsed
  # time on that one sensor tells arming and cleaning apart.
  - id: clean_ds
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: clean_running
    type: bool
    restore_value: false
    initial_value: 'false'
  # False until the machine itself confirms; guards against a lost command.
  - id: clean_confirmed
    type: bool
    restore_value: false
    initial_value: 'false'
  # True only while we are waking the machine before arming a backflush.
  # MEASURED 8 Aug 20:05: a backflush fired in standby armed at 20:05:09 and
  # the machine did not report itself awake until 20:05:15 -- six of the
  # fifteen paddle seconds were spent on a machine that could not pump. That
  # attempt aborted; the retry with the machine already on ran the full cycle.
  - id: clean_waking
    type: bool
    restore_value: false
    initial_value: 'false'
  # What is actually printable of each bean name, recomputed only when the
  # HA option changes. See the text_sensor comment for why this exists.
  - id: beans_hop_ascii
    type: std::string
    restore_value: false
    initial_value: '"--"'
  - id: beans_shot_ascii
    type: std::string
    restore_value: false
    initial_value: '""'
  # True when THIS shot is not using the hopper beans. The HA log script
  # resets the override after every logged row, so this self-clears.
  - id: beans_override
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: batt_pct
    type: int
    restore_value: false
    initial_value: '-1'
  # Which carousel card is showing. Rotating the knob moves through these;
  # anything that returns "home" resets to 0 via go_main.
  #   0 MACHINE   1 SHOT   2 GRINDER   3 CARE   4 BOILERS
  - id: card_i
    type: int
    restore_value: false
    initial_value: '0'
  - id: ago_clean
    type: std::string
    restore_value: false
    initial_value: '"--"'
  - id: ago_grind
    type: std::string
    restore_value: false
    initial_value: '"--"'
  # Hours since the last backflush, so the CARE card can colour itself.
  # -1 = not known yet.
  - id: clean_age_h
    type: int
    restore_value: false
    initial_value: '-1'
  - id: when_txt
    type: std::string
    restore_value: false
    initial_value: '"--"'
  # "ready 3:10" while the boiler climbs. The machine publishes the moment it
  # expects to be ready as an ISO timestamp; the display used to subscribe to
  # that and then throw the value away, keeping only "is the string empty" as
  # a heating flag. This is the number you actually want walking in.
  - id: ready_txt
    type: std::string
    restore_value: false
    initial_value: '""'
  # Rating is the one thing the machine cannot measure, so it is the one
  # thing worth typing. Rotation is rebound while this is true.
  - id: rate_mode
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: rate_val
    type: int
    restore_value: false
    initial_value: '3'
  # Taste is the one axis nothing else in the chain can see. Grind by Sync
  # closes its own loop on dose and yield -- it is optimising for hitting the
  # recipe, not for the cup. -2 sour .. 0 balanced .. +2 bitter, matching
  # input_number.coffee_shot_taste so it charts against grind setting.
  - id: taste_val
    type: int
    restore_value: false
    initial_value: '0'
  # 0 = espresso, 1 = milk. Same shot drunk two ways does not taste the same,
  # so without this the taste and score columns are not comparable row to row.
  - id: serve_i
    type: int
    restore_value: false
    initial_value: '0'
  # 0 = picking serve, 1 = taste, 2 = score. One tap between them, one write
  # at the end -- an abandoned rating leaves nothing behind.
  - id: rate_step
    type: int
    restore_value: false
    initial_value: '0'
  # Whether THIS shot has been rated. Without it the card would show the
  # previous cup's verdict and imply it belongs to this one.
  - id: rated_shot
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: main_txt
    type: std::string
    restore_value: false
    initial_value: '"..."'
  - id: main_txt_c
    type: uint32_t
    restore_value: false
    initial_value: '0x505050'
  - id: main_ring_c
    type: uint32_t
    restore_value: false
    initial_value: '0x1E1E1E'
  - id: main_icon_c
    type: uint32_t
    restore_value: false
    initial_value: '0x3A3A3A'
  - id: uuid_seen
    type: bool
    restore_value: false
    initial_value: 'false'
  # The last_grind timestamp we have already reacted to. A new SHOT is a new
  # VALUE, not merely another delivery of the same one -- see the guard on
  # last_grind_txt for why that distinction cost an afternoon.
  - id: last_grind_seen
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: grind_is_new
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: time_c
    type: uint32_t
    restore_value: false
    initial_value: '0x8A8A8A'
  - id: have_shot
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: last_ratio
    type: float
    restore_value: false
    initial_value: '0.0f'
  # res_c is the OVERALL verdict: green only when ratio AND time both land in
  # band, amber when one of them missed, red when both did. ratio_c is the
  # ratio alone. Keeping them separate is what stops the aggregate verdict
  # from hiding which half went wrong -- ring shows res_c, the big number
  # shows ratio_c, and the meta line under it is coloured by time_c.
  - id: res_c
    type: uint32_t
    restore_value: false
    initial_value: '0xE31E24'
  - id: ratio_c
    type: uint32_t
    restore_value: false
    initial_value: '0xE31E24'
  - id: prev_grind
    type: float
    restore_value: false
    initial_value: '0.0f'
  - id: grind_delta
    type: float
    restore_value: false
    initial_value: '0.0f'
  - id: have_grind
    type: bool
    restore_value: false
    initial_value: 'false'

# --- Haptics: DRV2605 driven directly over I2C ---
# The RAR external component is deliberately not used: its setup() reads a
# status register this chip NACKs, so it bailed before setting LRA mode and
# library 6. Writes work fine, so the registers are driven here.
script:
  - id: haptic_init
    then:
      - lambda: |-
          const uint8_t addr = 0x5A;
          uint8_t mode_run[2] = {0x01, 0x00};
          uint8_t feedback[2] = {0x1A, 0x80};
          uint8_t library[2]  = {0x03, 0x06};
          auto e1 = id(ic_bus)->write(addr, mode_run, 2);
          auto e2 = id(ic_bus)->write(addr, feedback, 2);
          auto e3 = id(ic_bus)->write(addr, library, 2);
          ESP_LOGI("haptic", "DRV2605 init (LRA, lib 6): %d %d %d (0 = OK)",
                   (int) e1, (int) e2, (int) e3);

  - id: haptic
    parameters:
      effect: int
    mode: parallel
    max_runs: 6
    then:
      - lambda: |-
          const uint8_t addr = 0x5A;
          uint8_t w1[2] = {0x04, (uint8_t) effect};
          uint8_t w2[2] = {0x05, 0x00};
          uint8_t go[2] = {0x0C, 0x01};
          id(ic_bus)->write(addr, w1, 2);
          id(ic_bus)->write(addr, w2, 2);
          id(ic_bus)->write(addr, go, 2);

  # Rotation used to flash the ring white and do nothing else. It now walks
  # the carousel: MACHINE - SHOT - GRINDER - CARE - BOILERS, wrapping both
  # ways. Transient screens (shot timer, clean cycle, steam) own the display
  # while they are up, so rotation is ignored there rather than yanking you
  # off a running timer.
  - id: card_move
    parameters:
      delta: int
    mode: restart
    then:
      - script.execute:
          id: haptic
          effect: 7
      - light.turn_on: back_light
      - script.execute: screentime
      - if:
          condition:
            lambda: 'return id(rate_mode);'
          then:
            # Rating owns the knob while it is open, so turning adjusts the
            # step you are on instead of sliding off the card entirely.
            - lambda: |-
                if (id(rate_step) == 0) {
                  int s = id(serve_i) + delta;
                  if (s < 0) s = 0;
                  if (s > 1) s = 1;
                  id(serve_i) = s;
                } else if (id(rate_step) == 1) {
                  int t = id(taste_val) + delta;
                  if (t < -2) t = -2;
                  if (t > 2) t = 2;
                  id(taste_val) = t;
                } else {
                  int r = id(rate_val) + delta;
                  if (r < 1) r = 1;
                  if (r > 5) r = 5;
                  id(rate_val) = r;
                }
            - script.execute: paint_result
          else:
            # A live timer owns the knob; a finished one does not. Once
            # extraction ends you can turn straight off the waiting screen,
            # and the main card keeps saying the record is still coming.
            - if:
                condition:
                  not:
                    or:
                      - and:
                          - lvgl.page.is_showing: page_shot
                          - lambda: 'return id(shot_running);'
                      - lvgl.page.is_showing: page_clean
                then:
                  - lambda: |-
                      int n = id(card_i) + delta;
                      if (n < 0) n = 4;
                      if (n > 4) n = 0;
                      id(card_i) = n;
                  - script.execute: show_card

  # Paint before showing so a card is never visibly stale for a frame.
  - id: show_card
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(card_i) == 0;'
          then:
            - script.execute: paint_main
            - lvgl.page.show: page_main
      - if:
          condition:
            lambda: 'return id(card_i) == 1;'
          then:
            - script.execute: paint_result
            - lvgl.page.show: page_result
      - if:
          condition:
            lambda: 'return id(card_i) == 2;'
          then:
            - script.execute: paint_grind
            - lvgl.page.show: page_grind
      - if:
          condition:
            lambda: 'return id(card_i) == 3;'
          then:
            - script.execute: paint_care
            - lvgl.page.show: page_care
      - if:
          condition:
            lambda: 'return id(card_i) == 4;'
          then:
            - script.execute: paint_boil
            - lvgl.page.show: page_boil

  # Both the machine and the grinder report ISO-8601 UTC timestamps. Turn
  # them into "3h ago" once, here, instead of in every label lambda.
  - id: refresh_ago
    mode: restart
    then:
      - lambda: |-
          // days-from-civil (Hinnant). Avoids timegm(), which is not
          // dependable in the ESP-IDF newlib build.
          auto to_epoch = [](const std::string &s) -> long long {
            int Y, M, D, h, m, sec;
            if (sscanf(s.c_str(), "%d-%d-%dT%d:%d:%d",
                       &Y, &M, &D, &h, &m, &sec) != 6) return 0LL;
            int y = Y - (M <= 2);
            int era = (y >= 0 ? y : y - 399) / 400;
            unsigned yoe = (unsigned) (y - era * 400);
            unsigned doy = (153u * (unsigned) (M + (M > 2 ? -3 : 9)) + 2u) / 5u
                           + (unsigned) D - 1u;
            unsigned doe = yoe * 365u + yoe / 4u - yoe / 100u + doy;
            long long days = (long long) era * 146097LL + (long long) doe
                             - 719468LL;
            return days * 86400LL + h * 3600LL + m * 60LL + sec;
          };
          auto fmt = [](long long ago) -> std::string {
            char b[24];
            if (ago < 0) ago = 0;
            if (ago < 60) snprintf(b, sizeof(b), "just now");
            else if (ago < 3600) snprintf(b, sizeof(b), "%lldm ago", ago / 60);
            else if (ago < 172800) snprintf(b, sizeof(b), "%lldh ago", ago / 3600);
            else snprintf(b, sizeof(b), "%lldd ago", ago / 86400);
            return std::string(b);
          };
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          long long t = (long long) now.timestamp;
          long long c = to_epoch(id(last_clean_txt).state);
          long long g = to_epoch(id(last_grind_txt).state);
          id(ago_clean) = (c > 0) ? fmt(t - c) : std::string("--");
          id(ago_grind) = (g > 0) ? fmt(t - g) : std::string("--");
          id(clean_age_h) = (c > 0) ? (int) ((t - c) / 3600LL) : -1;
          // Wall clock of the last grind, in LOCAL time. "3h ago" is fine
          // for the care card, but for a shot you want to know it was 08:14.
          if (g > 0) {
            auto lt = ESPTime::from_epoch_local((time_t) g);
            static const char *MON[] = {"Jan", "Feb", "Mar", "Apr", "May",
                                        "Jun", "Jul", "Aug", "Sep", "Oct",
                                        "Nov", "Dec"};
            char w[32];
            if (lt.year == now.year && lt.day_of_year == now.day_of_year)
              snprintf(w, sizeof(w), "today  %02d:%02d", lt.hour, lt.minute);
            else if (lt.year == now.year &&
                     lt.day_of_year == now.day_of_year - 1)
              snprintf(w, sizeof(w), "yesterday  %02d:%02d", lt.hour,
                       lt.minute);
            else
              snprintf(w, sizeof(w), "%s %d  %02d:%02d", MON[lt.month - 1],
                       lt.day_of_month, lt.hour, lt.minute);
            id(when_txt) = std::string(w);
          }
      - script.execute: paint_care
      - script.execute: paint_grind
      - script.execute: paint_result

  - id: paint_grind
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_gr_dose
          text: !lambda |-
            static char b[16];
            float d = id(sync_dose).state;
            if (std::isnan(d)) return std::string("-- g");
            snprintf(b, sizeof(b), "%.1f g", d);
            return std::string(b);
      - lvgl.label.update:
          id: lbl_gr_setting
          text: !lambda |-
            static char b[20];
            float g = id(sync_grind).state;
            if (std::isnan(g)) return std::string("grind --");
            snprintf(b, sizeof(b), "grind %d", (int) g);
            return std::string(b);
      - lvgl.label.update:
          id: lbl_gr_meta
          text: !lambda |-
            static char b[40];
            snprintf(b, sizeof(b), "%.1f s  |  %s",
                     id(sync_gtime).state, id(sync_quality).state.c_str());
            return std::string(b);
      - lvgl.label.update:
          id: lbl_gr_beans
          text: !lambda 'return id(beans_hop_ascii);'
      - lvgl.label.update:
          id: lbl_gr_roast
          text: !lambda |-
            static char b[44];
            float d = id(roast_d).state;
            auto w = id(window_txt).state;
            bool have_w = !w.empty() && w != "unavailable" && w != "unknown";
            if (std::isnan(d)) return std::string(have_w ? w : std::string(""));
            snprintf(b, sizeof(b), "%dd off roast - %s", (int) d,
                     have_w ? w.c_str() : "?");
            return std::string(b);
          # Same three colours the rest of the UI already uses for good /
          # marginal / not-yet-known. No new palette for one line.
          text_color: !lambda |-
            auto w = id(window_txt).state;
            if (w == "prime") return lv_color_hex(0x35C759);
            if (w == "past prime") return lv_color_hex(0xE8A33D);
            return lv_color_hex(0x8A8A8A);
      - lvgl.label.update:
          id: lbl_gr_ago
          text: !lambda 'return id(ago_grind);'

  - id: paint_care
    mode: restart
    then:
      # total_coffees_made is cumulative and never resets, so the useful
      # number is the difference from the count recorded at the last clean.
      # -1 means the baseline has not been written yet; fall back to total.
      - lambda: |-
          float t = id(total_shots).state;
          float base = id(shots_base).state;
          id(shots_since_clean) =
              (!std::isnan(t) && !std::isnan(base) && base > 0.0f)
                  ? (int) (t - base) : -1;
      - lvgl.label.update:
          id: lbl_care_ago
          text: !lambda 'return id(ago_clean);'
          # La Marzocco ask for a backflush daily. Past two days, say so.
          text_color: !lambda |-
            int h = id(clean_age_h);
            if (h < 0) return lv_color_hex(0x585858);
            if (h >= 48) return lv_color_hex(0xE31E24);
            if (h >= 24) return lv_color_hex(0xE8A33D);
            return lv_color_hex(0x35C759);
      - lvgl.label.update:
          id: lbl_care_shots
          text: !lambda |-
            static char b[36];
            int since = id(shots_since_clean);
            float tot = id(total_shots).state;
            if (since < 0 && std::isnan(tot)) {
              snprintf(b, sizeof(b), "shots --");
            } else if (since < 0) {
              snprintf(b, sizeof(b), "%d shots total", (int) tot);
            } else {
              snprintf(b, sizeof(b), "%d shots since clean", since);
            }
            return std::string(b);
          text_color: !lambda |-
            int since = id(shots_since_clean);
            if (since < 0) return lv_color_hex(0x6A6A6A);
            if (since >= $clean_due_shots)  return lv_color_hex(0xE31E24);
            if (since >= $clean_warn_shots) return lv_color_hex(0xE8A33D);
            return lv_color_hex(0x6A6A6A);
      # This slot used to read "tank ok" forever -- the machine is plumbed
      # in, so the tank sensor can never say anything else. Flushes per
      # hundred shots is the number that actually reflects how it is kept.
      - lvgl.label.update:
          id: lbl_care_water
          text: !lambda |-
            static char b[32];
            float f = id(total_flushes).state;
            float c = id(total_shots).state;
            if (std::isnan(f) || std::isnan(c) || c < 1.0f) {
              return std::string("");
            }
            snprintf(b, sizeof(b), "%d flushes / %d shots", (int) f, (int) c);
            return std::string(b);
          text_color: 0x585858

  - id: paint_boil
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_bo_temp
          text: !lambda |-
            static char b[16];
            snprintf(b, sizeof(b), "%.1f", id(coffee_temp_val));
            return std::string(b);
      - lvgl.label.update:
          id: lbl_bo_coffee
          text: !lambda |-
            auto cv = id(coffee_ready_txt).state;
            bool heat = !cv.empty() && cv != "unavailable" && cv != "unknown";
            if (!id(micra_on).state) return std::string("coffee  standby");
            return std::string(heat ? "coffee  heating" : "coffee  ready");
          text_color: !lambda |-
            auto cv = id(coffee_ready_txt).state;
            bool heat = !cv.empty() && cv != "unavailable" && cv != "unknown";
            if (!id(micra_on).state) return lv_color_hex(0x585858);
            return lv_color_hex(heat ? 0xE8A33D : 0x35C759);
      - lvgl.label.update:
          id: lbl_bo_steam
          text: !lambda |-
            static char b[28];
            auto sv = id(steam_ready_txt).state;
            bool heat = !sv.empty() && sv != "unavailable" && sv != "unknown";
            if (!id(steam_on).state) { snprintf(b, sizeof(b), "steam  off"); }
            else snprintf(b, sizeof(b), "steam  lv%d  %s", id(steam_level_val),
                          heat ? "heating" : "ready");
            return std::string(b);
          text_color: !lambda |-
            auto sv = id(steam_ready_txt).state;
            bool heat = !sv.empty() && sv != "unavailable" && sv != "unknown";
            if (!id(steam_on).state) return lv_color_hex(0x585858);
            return lv_color_hex(heat ? 0xE8A33D : 0x35C759);

  # Hold on the shot card to open rating; hold again to abandon it. Always
  # reopens at step 0 so the sequence is the same every time.
  - id: rate_hold
    mode: restart
    then:
      - script.execute:
          id: haptic
          effect: 1
      - light.turn_on: back_light
      - script.execute: screentime
      - lambda: |-
          id(rate_mode) = !id(rate_mode);
          if (id(rate_mode)) id(rate_step) = 0;
      - script.execute: paint_result

  # Tap advances, then commits. All THREE values are written together on the
  # last tap, so abandoning halfway leaves Home Assistant untouched rather
  # than recording a serve with no taste. A stray tap outside rating just
  # goes home.
  #
  # mode: single, not restart. This script fires irreversible outward calls
  # (three helper writes and a log append); on restart a second tap arriving
  # mid-sequence would re-enter the commit branch with rate_mode still true
  # and append a second row. single drops the re-entrant tap instead. The
  # state flip below is the other half of that guard -- it happens BEFORE any
  # action goes out, so even a dropped-then-retried tap finds rate_mode false
  # and falls through to go_main.
  - id: rate_tap
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(rate_mode);'
          then:
            - script.execute:
                id: haptic
                effect: 1
            - script.execute: screentime
            - if:
                condition:
                  lambda: 'return id(rate_step) < 2;'
                then:
                  - lambda: 'id(rate_step) = id(rate_step) + 1;'
                  - script.execute: paint_result
                else:
                  # Close the gesture first, then report it. Nothing below
                  # reads rate_mode or rate_step, and the three values live
                  # in their own globals, so clearing here costs nothing and
                  # removes the whole re-entrancy question.
                  - lambda: |-
                      id(rate_mode) = false;
                      id(rate_step) = 0;
                      id(rated_shot) = true;
                  - script.execute: paint_result
                  - homeassistant.action:
                      action: input_select.select_option
                      data:
                        entity_id: input_select.coffee_served_as
                      data_template:
                        option: "{{ s }}"
                      variables:
                        s: !lambda |-
                          return std::string(id(serve_i) == 0 ? "Espresso"
                                                              : "Milk");
                  - homeassistant.action:
                      action: input_number.set_value
                      data:
                        entity_id: input_number.coffee_shot_taste
                      data_template:
                        value: "{{ t }}"
                      variables:
                        t: !lambda 'return id(taste_val);'
                  - homeassistant.action:
                      action: input_number.set_value
                      data:
                        entity_id: input_number.coffee_shot_rating
                      data_template:
                        value: "{{ r }}"
                      variables:
                        r: !lambda 'return id(rate_val);'
                  # The knob is the only thing in the chain holding the real
                  # numbers at this moment. HA's dose/yield/grind helpers are
                  # manual entry and were still sitting at their minimums, so
                  # a row logged from them alone would read 12.0 -> 15.0 g
                  # (1:1.25) for every shot ever pulled. Push what Mahlkonig
                  # measured, then log. Skipped entirely if no shot record has
                  # arrived, because writing NaN into an input_number fails.
                  - if:
                      condition:
                        lambda: |-
                          return !std::isnan(id(sync_dose).state)
                                 && id(sync_dose).state > 0.1f;
                      then:
                        - homeassistant.action:
                            action: input_number.set_value
                            data:
                              entity_id: input_number.coffee_dose
                            data_template:
                              value: "{{ v }}"
                            variables:
                              v: !lambda 'return id(sync_dose).state;'
                        - homeassistant.action:
                            action: input_number.set_value
                            data:
                              entity_id: input_number.coffee_yield
                            data_template:
                              value: "{{ v }}"
                            variables:
                              v: !lambda 'return id(sync_yield).state;'
                  # ORDER MATTERS. Every write above has to land before this
                  # runs, because the script reads all of them back out of
                  # Home Assistant to build the row.
                  - homeassistant.action:
                      action: script.coffee_log_shot
                      data_template:
                        shot_time: "{{ s }}"
                      variables:
                        # shot_ds is the knob's own stopwatch and is the
                        # number he watched count up. It survives until the
                        # next extraction starts, so it is still this shot's
                        # at rating time -- unless the device rebooted in
                        # between, which is what the Mahlkonig fallback is for.
                        s: !lambda |-
                          if (id(shot_ds) > 0) return id(shot_ds) / 10.0f;
                          float t = id(sync_time).state;
                          return std::isnan(t) ? 0.0f : t;
                  - delay: 900ms
                  - script.execute: go_main
          else:
            - script.execute: go_main

  # Single way home, so card_i can never disagree with what is on screen.
  - id: go_main
    mode: restart
    then:
      - lambda: |-
          id(card_i) = 0;
          id(rate_mode) = false;
          id(rate_step) = 0;
          // cfg_edit gates every HA -> local sync. Being yanked to the shot
          // page mid-edit used to strand it true, after which coffee temp,
          // ratio and the rest silently stopped tracking Home Assistant for
          // the rest of the boot.
          id(cfg_edit) = false;
      - lvgl.page.show: page_main
      - script.execute: paint_main

  - id: screentime
    mode: restart
    then:
      - light.turn_on: back_light
      - delay: $screen_timeout
      - light.turn_off: back_light

  # ONE place decides whether a shot was good. Every card calls this before
  # painting, so the main card and the SHOT card cannot disagree about the
  # same cup no matter which painted last. No delays inside, so it runs
  # inline like a function call.
  - id: calc_verdict
    mode: restart
    then:
      - lambda: |-
          float d = id(sync_dose).state;
          float y = id(sync_yield).state;
          // A present dose with an absent yield is not a shot -- it used to
          // divide anyway and paint "1 : nan" in confident red.
          bool dy = (d > 0.1f) && !std::isnan(y);
          id(last_ratio) = dy ? (y / d) : 0.0f;
          id(have_shot) = dy;
          // Fall back to sane espresso numbers if a helper is unavailable,
          // so a dead cloud never turns the card into nonsense.
          float tr = id(tgt_ratio).state;
          float tt = id(tgt_ratio_tol).state;
          float tv = id(tgt_time_tol).state;
          if (std::isnan(tr) || tr <= 0.0f) tr = 1.80f;
          if (std::isnan(tt) || tt <= 0.0f) tt = 0.10f;
          if (std::isnan(tv) || tv <= 0.0f) tv = 5.0f;
          // Precedence: the knob's own target first, then the recipe's,
          // then the helper, then a sane default. The recipe target can only
          // be changed at the grinder, so an override here is the only way
          // to aim at a different time from the machine side. 0 is not a
          // time -- it means "no override", and the recipe wins again.
          float ts = id(tgt_time_val);
          if (ts <= 0.0f) ts = id(mk_time_target).state;
          if (std::isnan(ts) || ts <= 0.0f) ts = id(tgt_time).state;
          if (std::isnan(ts) || ts <= 0.0f) ts = 25.0f;
          float r = id(last_ratio);
          float st = id(sync_time).state;
          bool have_time = !std::isnan(st) && st > 0.0f;
          bool r_ok = (r >= tr - tt && r <= tr + tt);
          // Time is judged by Mahlkonig when Mahlkonig has an opinion. Only
          // if it is silent do we fall back to comparing against the target
          // ourselves -- so the two can never reach opposite conclusions.
          // ...but only while we are still aiming at Mahlkonig's target.
          // Once overridden its verdict is judging a different question, so
          // it has to be dropped or the ring and the number disagree.
          bool time_override = id(tgt_time_val) > 0.0f;
          auto tq = id(mk_time_quality).state;
          bool have_tq = !time_override &&
                         (tq == "OK" || tq == "OFF_BELOW" || tq == "OFF_ABOVE");
          bool t_ok = have_tq ? (tq == "OK")
                    : (have_time && st >= ts - tv && st <= ts + tv);
          id(ratio_c) = r_ok ? 0x35C759 : 0xE31E24;
          id(time_c) = !(have_tq || have_time) ? 0x8A8A8A
                     : (t_ok ? 0x35C759 : 0xE8A33D);
          id(res_c) = (r_ok && t_ok) ? 0x35C759
                    : ((r_ok || t_ok) ? 0xE8A33D : 0xE31E24);

  - id: paint_main
    mode: restart
    then:
      - script.execute: calc_verdict
      - lambda: |-
          bool known = id(micra_on).has_state() || id(power_pending);
          bool on = id(power_pending) ? id(power_want) : id(micra_on).state;
          auto cv = id(coffee_ready_txt).state;
          bool heating = !cv.empty() && cv != "unavailable" && cv != "unknown";
          // The Micra has no soft power-off. What the integration calls "off"
          // is standby: mains still on, boilers cold, gateway still talking.
          // Say STANDBY so the display matches what the machine is doing.
          const char *txt = "STANDBY";
          uint32_t ring_c = 0x242424, txt_c = 0x585858, icon_c = 0x3A3A3A;
          if (!known) {
            txt = "...";
            txt_c = 0x505050; ring_c = 0x1E1E1E;
          } else if (on && heating) {
            txt = "HEATING";
            txt_c = 0xFF7A7A; ring_c = 0x8E1116; icon_c = 0x8E1116;
          } else if (on) {
            txt = "READY";
            txt_c = 0xFFFFFF; ring_c = 0xE31E24; icon_c = 0xE31E24;
          }
          id(main_txt) = txt;
          id(main_txt_c) = txt_c;
          id(main_ring_c) = ring_c;
          id(main_icon_c) = icon_c;
      # Same civil-days conversion refresh_ago uses; timegm() is not
      # dependable in this newlib build.
      - lambda: |-
          id(ready_txt) = "";
          auto now = id(ha_time).now();
          const std::string &r = id(coffee_ready_txt).state;
          if (now.is_valid() && r.size() >= 19 && r != "unavailable"
              && r != "unknown") {
            int Y, M, D, h, m, sec;
            if (sscanf(r.c_str(), "%d-%d-%dT%d:%d:%d",
                       &Y, &M, &D, &h, &m, &sec) == 6) {
              int y = Y - (M <= 2);
              int era = (y >= 0 ? y : y - 399) / 400;
              unsigned yoe = (unsigned) (y - era * 400);
              unsigned doy = (153u * (unsigned) (M + (M > 2 ? -3 : 9)) + 2u)
                             / 5u + (unsigned) D - 1u;
              unsigned doe = yoe * 365u + yoe / 4u - yoe / 100u + doy;
              long long days = (long long) era * 146097LL + (long long) doe
                               - 719468LL;
              long long t = days * 86400LL + h * 3600LL + m * 60LL + sec;
              long long left = t - (long long) now.timestamp;
              // Past its own estimate, or absurdly far out, say nothing
              // rather than counting up or promising an hour.
              if (left > 0 && left < 3600) {
                char b[16];
                snprintf(b, sizeof(b), "ready %lld:%02lld", left / 60,
                         left % 60);
                id(ready_txt) = std::string(b);
              }
            }
          }
      - lvgl.label.update:
          id: lbl_main_ready
          text: !lambda 'return id(ready_txt);'
      - lvgl.label.update:
          id: lbl_state
          text: !lambda |-
            std::string s = id(main_txt);
            return s;
          text_color: !lambda 'return lv_color_hex(id(main_txt_c));'
      - lvgl.widget.update:
          id: ring
          border_color: !lambda 'return lv_color_hex(id(main_ring_c));'
          border_width: 6
      # Hours and shots are two different ways of being dirty -- a quiet day
      # and a heavy one are not the same. Whichever crosses first wins, and
      # the main card is where it has to show, because the CARE card is a
      # place you only go when you already suspect something.
      - lvgl.label.update:
          id: lbl_main_care
          text: !lambda |-
            int h = id(clean_age_h);
            int n = id(shots_since_clean);
            bool due  = (h >= 48) || (n >= $clean_due_shots);
            bool soon = (h >= 24) || (n >= $clean_warn_shots);
            if (due)  return std::string("backflush due");
            if (soon) return std::string("backflush soon");
            return std::string("");
          text_color: !lambda |-
            int h = id(clean_age_h);
            int n = id(shots_since_clean);
            if ((h >= 48) || (n >= $clean_due_shots))
              return lv_color_hex(0xE31E24);
            return lv_color_hex(0xB0823A);
      - lvgl.label.update:
          id: lbl_last
          text: !lambda |-
            static char b[32];
            // While the grinder record is still in flight this line is the
            // only thing on the main card that can say so -- otherwise
            // leaving the shot screen looks like the shot was dropped.
            if (id(waiting_shot)) {
              snprintf(b, sizeof(b), "waiting for shot data");
              return b;
            }
            if (!id(have_shot)) { b[0] = 0; return b; }
            // The score joins the line once given, so "was the last one any
            // good" is answerable from the standby screen without touching
            // anything. Omitted rather than zeroed when unrated.
            if (id(rated_shot))
              snprintf(b, sizeof(b), "1:%.1f   %.1f s   %d/5",
                       id(last_ratio), id(sync_time).state, id(rate_val));
            else
              snprintf(b, sizeof(b), "1:%.1f   %.1f s",
                       id(last_ratio), id(sync_time).state);
            return b;
          # Carries the same three-way verdict as the ring, rated or not --
          # waiting on a rating to call a shot good would leave good shots
          # looking bad. Brighter than the old 0x4E8C57, which was too muted
          # to register at a glance from across the kitchen.
          text_color: !lambda |-
            if (id(waiting_shot)) return lv_color_hex(0xC8913C);
            if (!id(have_shot)) return lv_color_hex(0x000000);
            if (id(res_c) == 0x35C759) return lv_color_hex(0x3FBF5A);
            if (id(res_c) == 0xE8A33D) return lv_color_hex(0xB0823A);
            return lv_color_hex(0x8C4E4E);

  - id: power_press
    mode: restart
    then:
      - lambda: |-
          // Read the MACHINE, never our own intent. The old form inverted
          // power_want on the second press inside the hold window, so
          // tap-tap on a cold machine sent it straight back to standby --
          // the exact opposite of what the comment below promises.
          if (!id(power_pending)) {
            bool now_on = id(micra_on).has_state() ? id(micra_on).state : false;
            id(power_want) = !now_on;
          }
          id(power_pending) = true;
      - script.execute: paint_main
      # NOT switch.toggle. The cloud round-trip takes seconds, during which
      # micra_on still reports the old value -- a toggle sent in that window
      # reads the stale state and undoes the previous press. We already know
      # what the user asked for, so send it absolutely. Pressing twice now
      # sends the same command twice instead of cancelling itself.
      - if:
          condition:
            lambda: 'return id(power_want);'
          then:
            - homeassistant.action:
                action: switch.turn_on
                data:
                  entity_id: $micra_power
          else:
            - homeassistant.action:
                action: switch.turn_off
                data:
                  entity_id: $micra_power
      - delay: 6s
      - lambda: 'id(power_pending) = false;'
      - script.execute: paint_main

  # A backflush needs the pump, and the pump needs the machine out of
  # standby. MEASURED 8 Aug: fired from standby, the paddle window opened at
  # 20:05:09 and the machine only reported itself awake at 20:05:15 -- that
  # attempt aborted at 15 s having never been usable. So wake first, arm
  # second, and say which one is happening.
  - id: start_clean
    mode: restart
    then:
      - script.execute:
          id: haptic
          effect: 1
      - light.turn_on: back_light
      - script.execute: screentime
      - lambda: |-
          id(cfg_edit) = false;
          id(clean_ds) = 0;
          id(clean_running) = false;
          id(clean_confirmed) = false;
          id(clean_waking) = !id(micra_on).state;
      - script.execute: paint_clean
      - lvgl.page.show: page_clean
      - if:
          condition:
            lambda: 'return id(clean_waking);'
          then:
            - homeassistant.action:
                action: switch.turn_on
                data:
                  entity_id: $micra_power
            - wait_until:
                condition:
                  lambda: 'return id(micra_on).state;'
                timeout: 40s
            # The switch flips a moment before the pump is actually usable.
            - delay: 4s
            - lambda: 'id(clean_waking) = false;'
            - script.execute: paint_clean
      - if:
          condition:
            lambda: 'return !id(micra_on).state;'
          then:
            # Never woke. Do not arm a paddle window the machine cannot honour.
            - lvgl.label.update:
                id: lbl_clean_head
                text: "MACHINE ASLEEP"
                text_color: 0xE8A33D
            - lvgl.label.update:
                id: lbl_clean_big
                text: ""
            - lvgl.label.update:
                id: lbl_clean_sub
                text: "could not wake it - try again"
            - delay: 6s
            - script.execute: go_main
          else:
            - lambda: |-
                id(clean_ds) = 0;
                id(clean_running) = true;
                id(clean_confirmed) = false;
            - script.execute: paint_clean
            - homeassistant.action:
                action: button.press
                data:
                  entity_id: $micra_backflush

  # Two phases on one screen, told apart purely by elapsed time on
  # micra_cleaning: under ~16 s the machine is still waiting for the paddle,
  # past that the paddle was moved and the cycle is actually running.
  - id: paint_clean
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_clean_head
          text: !lambda |-
            if (id(clean_waking)) return std::string("WAKING MACHINE");
            return std::string(id(clean_ds) < (uint32_t) $clean_arm_ds
                               ? "MOVE THE PADDLE" : "CLEANING");
          text_color: !lambda |-
            if (id(clean_waking)) return lv_color_hex(0xE8A33D);
            return lv_color_hex(id(clean_ds) < (uint32_t) $clean_arm_ds
                                ? 0x4FA3E3 : 0xE31E24);
      - lvgl.label.update:
          id: lbl_clean_big
          text: !lambda |-
            static char b[12];
            if (id(clean_waking)) return std::string("");
            snprintf(b, sizeof(b), "%u", (unsigned) (id(clean_ds) / 10));
            return std::string(b);
      - lvgl.label.update:
          id: lbl_clean_sub
          text: !lambda |-
            static char b[40];
            if (id(clean_waking))
              return std::string("the pump needs it awake");
            if (id(clean_ds) >= (uint32_t) $clean_arm_ds)
              return std::string("seconds elapsed");
            // Small type, because it is the caveat and not the news: the
            // machine will not tell us the paddle moved, it will only keep
            // the cycle alive past this point.
            int left = ((int) $clean_arm_ds - (int) id(clean_ds) + 9) / 10;
            if (left < 0) left = 0;
            snprintf(b, sizeof(b), "move it now - confirms in %2ds", left);
            return std::string(b);
      - lvgl.arc.update:
          id: arc_clean
          # One continuous fill for the whole cycle. The old arc drained
          # through the arm window and then refilled, which is two resets on
          # a screen whose whole job is to say that nothing was lost.
          value: !lambda |-
            if (id(clean_waking)) return 0.0f;
            float f = id(clean_ds) * 100.0f / (float) $clean_total_ds;
            return f > 100.0f ? 100.0f : f;
          # The indicator part, not the arc's own -- the arc itself is the
          # dark unfilled track, so recolouring that would change nothing.
          indicator:
            arc_color: !lambda |-
              if (id(clean_waking)) return lv_color_hex(0xE8A33D);
              return lv_color_hex(id(clean_ds) < (uint32_t) $clean_arm_ds
                                  ? 0x2A6FB0 : 0xE31E24);

  - id: finish_clean
    mode: restart
    then:
      - script.execute:
          id: haptic
          effect: 1
      - if:
          condition:
            lambda: 'return id(clean_ds) >= (uint32_t) $clean_arm_ds;'
          then:
            - lvgl.label.update:
                id: lbl_clean_head
                text: "CLEAN DONE"
                text_color: 0x35C759
            - lvgl.label.update:
                id: lbl_clean_sub
                text: "backflush complete"
            - lvgl.arc.update:
                id: arc_clean
                value: 100
                indicator:
                  arc_color: 0x35C759
          else:
            - lvgl.label.update:
                id: lbl_clean_head
                text: "NOT STARTED"
                text_color: 0xE8A33D
            - lvgl.label.update:
                id: lbl_clean_big
                text: ""
            - lvgl.label.update:
                id: lbl_clean_sub
                text: "paddle was not moved"
            - lvgl.arc.update:
                id: arc_clean
                value: 0
                indicator:
                  arc_color: 0xE8A33D
      - delay: 5s
      - lambda: 'id(clean_confirmed) = false;'
      - if:
          condition:
            lvgl.page.is_showing: page_clean
          then:
            - script.execute: go_main

  - id: cfg_move
    parameters:
      delta: int
    mode: parallel
    max_runs: 8
    then:
      - script.execute:
          id: haptic
          effect: 7
      - light.turn_on: back_light
      - script.execute: screentime
      # cfg_edit alone is no longer enough to say WHAT is being edited, now
      # that two items are editable. cfg_i cannot change while cfg_edit is
      # true (turning adjusts the value instead of moving), so the pair is
      # unambiguous.
      - lambda: |-
          if (id(cfg_edit) && id(cfg_i) == 2) {
            float t = id(coffee_temp_val) + 0.5f * delta;
            if (t < 85.0f) t = 85.0f;
            if (t > 104.0f) t = 104.0f;
            id(coffee_temp_val) = t;
          } else if (id(cfg_edit) && id(cfg_i) == 3) {
            float r = id(ratio_val) + 0.05f * delta;
            if (r < 1.20f) r = 1.20f;
            if (r > 3.00f) r = 3.00f;
            id(ratio_val) = r;
          } else if (id(cfg_edit) && id(cfg_i) == 4) {
            // Whole seconds: the grinder's own target is a whole number, and
            // half-second precision on a shot target is false accuracy.
            float t = id(tgt_time_val) + 1.0f * delta;
            if (t < 0.0f)  t = 0.0f;
            if (t > 45.0f) t = 45.0f;
            id(tgt_time_val) = t;
          } else if (id(cfg_edit) && id(cfg_i) == 5) {
            // Beans have no local value to hold: the option list lives in
            // Home Assistant and the knob never sees it. Home Assistant's
            // own select_next / select_previous do the walking, fired from
            // the actions below -- so this branch exists only to stop the
            // cursor sliding off the item while it is being edited.
          } else if (id(cfg_edit) && id(cfg_i) == 7) {
            float p = id(preinf_time_val) + 0.5f * delta;
            if (p < 0.0f)  p = 0.0f;
            if (p > 30.0f) p = 30.0f;
            id(preinf_time_val) = p;
          } else if (id(cfg_edit) && id(cfg_i) == 8) {
            float p = id(prebrew_on_val) + 0.1f * delta;
            if (p < 0.0f)  p = 0.0f;
            if (p > 30.0f) p = 30.0f;
            id(prebrew_on_val) = p;
          } else if (id(cfg_edit) && id(cfg_i) == 9) {
            float p = id(prebrew_off_val) + 0.1f * delta;
            if (p < 0.0f)  p = 0.0f;
            if (p > 30.0f) p = 30.0f;
            id(prebrew_off_val) = p;
          } else {
            // TWELVE items now. Renumbering this list means touching four
            // places: here, cfg_act, paint_cfg, and page_cfg's on_long_press.
            const int n = 12;
            id(cfg_i) = ((id(cfg_i) + delta) % n + n) % n;
          }
      - if:
          condition:
            lambda: 'return id(cfg_edit) && id(cfg_i) == 2;'
          then:
            - script.execute: push_temp
      - if:
          condition:
            lambda: 'return id(cfg_edit) && id(cfg_i) == 3;'
          then:
            - script.execute: push_ratio
      # No debounce on these two: an input_select has no intermediate values
      # to spam, each detent is one discrete option, and HA is the only thing
      # that knows how many there are.
      - if:
          condition:
            lambda: 'return id(cfg_edit) && id(cfg_i) == 4;'
          then:
            - script.execute: push_tgt_time
      - if:
          condition:
            lambda: 'return id(cfg_edit) && id(cfg_i) == 5 && delta > 0;'
          then:
            - homeassistant.action:
                action: input_select.select_next
                data:
                  entity_id: input_select.coffee_current_beans
                  cycle: "true"
      - if:
          condition:
            lambda: 'return id(cfg_edit) && id(cfg_i) == 5 && delta < 0;'
          then:
            - homeassistant.action:
                action: input_select.select_previous
                data:
                  entity_id: input_select.coffee_current_beans
                  cycle: "true"
      - if:
          condition:
            lambda: 'return id(cfg_edit) && id(cfg_i) == 7;'
          then:
            - script.execute: push_preinf
      - if:
          condition:
            lambda: 'return id(cfg_edit) && id(cfg_i) == 8;'
          then:
            - script.execute: push_prebrew_on
      - if:
          condition:
            lambda: 'return id(cfg_edit) && id(cfg_i) == 9;'
          then:
            - script.execute: push_prebrew_off
      - script.execute: paint_cfg

  # Debounced: only sends once the knob stops, so a fast spin does not fire
  # twenty service calls at Home Assistant.
  - id: push_temp
    mode: restart
    then:
      - delay: 600ms
      - homeassistant.action:
          action: number.set_value
          data:
            entity_id: $micra_temp
          data_template:
            value: "{{ t }}"
          variables:
            t: !lambda 'return id(coffee_temp_val);'

  # Same debounce as push_temp: a fast spin should not fire twenty writes.
  - id: push_ratio
    mode: restart
    then:
      - delay: 600ms
      - homeassistant.action:
          action: input_number.set_value
          data:
            entity_id: input_number.coffee_target_ratio
          data_template:
            value: "{{ r }}"
          variables:
            r: !lambda 'return id(ratio_val);'

  - id: push_preinf
    mode: restart
    then:
      - delay: 600ms
      - homeassistant.action:
          action: number.set_value
          data:
            entity_id: $micra_preinf_time
          data_template:
            value: "{{ p }}"
          variables:
            p: !lambda 'return id(preinf_time_val);'

  - id: push_prebrew_on
    mode: restart
    then:
      - delay: 600ms
      - homeassistant.action:
          action: number.set_value
          data:
            entity_id: $micra_prebrew_on
          data_template:
            value: "{{ p }}"
          variables:
            p: !lambda 'return id(prebrew_on_val);'

  - id: push_prebrew_off
    mode: restart
    then:
      - delay: 600ms
      - homeassistant.action:
          action: number.set_value
          data:
            entity_id: $micra_prebrew_off
          data_template:
            value: "{{ p }}"
          variables:
            p: !lambda 'return id(prebrew_off_val);'

  - id: push_tgt_time
    mode: restart
    then:
      - delay: 600ms
      - homeassistant.action:
          action: input_number.set_value
          data:
            entity_id: input_number.coffee_target_shot_time
          data_template:
            value: "{{ t }}"
          variables:
            t: !lambda 'return id(tgt_time_val);'

  # --- Per-recipe presets -------------------------------------------------
  # The grinder holds three cloud recipes and reports only WHICH one is
  # loaded -- there is no name, and the app has no rename. Switching recipe
  # is already how a different bag gets dialled in, so that index is the
  # natural key for "the machine settings that belong with these beans".
  # Saving is a HOLD on the BEANS item; applying happens by itself when the
  # grinder reports a different recipe.
  - id: preset_save
    mode: restart
    then:
      - script.execute:
          id: haptic
          effect: 1
      - lambda: |-
          int i = id(recipe_i);
          if (i < 0 || i > 2) return;
          id(preset_temp)[i]   = id(coffee_temp_val);
          id(preset_ratio)[i]  = id(ratio_val);
          id(preset_preinf)[i] = id(preinf_time_val);
          ESP_LOGI("preset", "saved slot %d: %.1fC 1:%.2f %.1fs", i,
                   id(coffee_temp_val), id(ratio_val), id(preinf_time_val));
      - script.execute: paint_cfg

  # A slot left at 0 was never saved, so applying it would push nonsense at
  # the machine. Each field is guarded on its own -- a half-filled slot is
  # still worth the half it has.
  - id: preset_apply
    mode: restart
    then:
      - delay: 300ms
      - if:
          condition:
            lambda: |-
              int i = id(recipe_i);
              return !id(cfg_edit) && i >= 0 && i <= 2 && id(preset_temp)[i] > 1.0f;
          then:
            - lambda: 'id(coffee_temp_val) = id(preset_temp)[id(recipe_i)];'
            - homeassistant.action:
                action: number.set_value
                data:
                  entity_id: $micra_temp
                data_template:
                  value: "{{ t }}"
                variables:
                  t: !lambda 'return id(coffee_temp_val);'
      - if:
          condition:
            lambda: |-
              int i = id(recipe_i);
              return !id(cfg_edit) && i >= 0 && i <= 2 && id(preset_ratio)[i] > 0.5f;
          then:
            - lambda: 'id(ratio_val) = id(preset_ratio)[id(recipe_i)];'
            - homeassistant.action:
                action: input_number.set_value
                data:
                  entity_id: input_number.coffee_target_ratio
                data_template:
                  value: "{{ r }}"
                variables:
                  r: !lambda 'return id(ratio_val);'
      - if:
          condition:
            lambda: |-
              int i = id(recipe_i);
              return !id(cfg_edit) && i >= 0 && i <= 2 && id(preset_preinf)[i] > 0.05f;
          then:
            - lambda: 'id(preinf_time_val) = id(preset_preinf)[id(recipe_i)];'
            - homeassistant.action:
                action: number.set_value
                data:
                  entity_id: $micra_preinf_time
                data_template:
                  value: "{{ p }}"
                variables:
                  p: !lambda 'return id(preinf_time_val);'
      - script.execute: paint_cfg
      - script.execute: paint_main

  - id: cfg_act
    mode: restart
    then:
      - script.execute:
          id: haptic
          effect: 1
      - if:
          condition:
            lambda: 'return id(cfg_i) == 0;'
          then:
            # Absolute, not a toggle -- same staleness trap as power_press.
            - if:
                condition:
                  lambda: 'return !id(steam_on).state;'
                then:
                  - homeassistant.action:
                      action: switch.turn_on
                      data:
                        entity_id: $micra_steam
                else:
                  - homeassistant.action:
                      action: switch.turn_off
                      data:
                        entity_id: $micra_steam
      - if:
          condition:
            lambda: 'return id(cfg_i) == 1;'
          then:
            - lambda: |-
                int lv = id(steam_level_val) + 1;
                if (lv > 3) lv = 1;
                id(steam_level_val) = lv;
            - homeassistant.action:
                action: select.select_option
                data:
                  entity_id: $micra_steam_level
                data_template:
                  option: "{{ lv }}"
                variables:
                  lv: !lambda 'return id(steam_level_val);'
      - if:
          condition:
            lambda: |-
              return id(cfg_i) == 2 || id(cfg_i) == 3 || id(cfg_i) == 4
                  || id(cfg_i) == 5 || id(cfg_i) == 7 || id(cfg_i) == 8
                  || id(cfg_i) == 9;
          then:
            - lambda: 'id(cfg_edit) = !id(cfg_edit);'
      - if:
          condition:
            lambda: 'return id(cfg_i) == 6;'
          then:
            - lambda: |-
                int m = id(preinf_mode_val) + 1;
                if (m > 2) m = 0;
                id(preinf_mode_val) = m;
            - homeassistant.action:
                action: select.select_option
                data:
                  entity_id: $micra_preinf_mode
                data_template:
                  option: "{{ opt }}"
                variables:
                  opt: !lambda |-
                    switch (id(preinf_mode_val)) {
                      case 0:  return std::string("disabled");
                      case 1:  return std::string("prebrew");
                      default: return std::string("preinfusion");
                    }
      - if:
          condition:
            lambda: 'return id(cfg_i) == 11;'
          then:
            - lambda: 'id(cfg_edit) = false;'
            - script.execute: go_main
      - script.execute: paint_cfg

  - id: paint_cfg
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(cfg_edit);'
          then:
            - lvgl.widget.update:
                id: ring_cfg
                border_color: 0xFFFFFF
                border_width: 10
          else:
            - lvgl.widget.update:
                id: ring_cfg
                border_color: 0xE31E24
                border_width: 6
      - if:
          condition:
            lambda: 'return id(cfg_i) == 0;'
          then:
            - lvgl.label.update:
                id: lbl_cfg_icon
                text: "󱌙"
            - lvgl.label.update:
                id: lbl_cfg_name
                text: "STEAM BOILER"
            - lvgl.label.update:
                id: lbl_cfg_value
                text_font: montserrat_48
                text: !lambda |-
                  std::string s = id(steam_on).state ? "ON" : "OFF";
                  return s;
            - lvgl.label.update:
                id: lbl_cfg_hint
                text: "tap to toggle"
      - if:
          condition:
            lambda: 'return id(cfg_i) == 1;'
          then:
            - lvgl.label.update:
                id: lbl_cfg_icon
                text: "󰓓"
            - lvgl.label.update:
                id: lbl_cfg_name
                text: "STEAM LEVEL"
            - lvgl.label.update:
                id: lbl_cfg_value
                text_font: montserrat_48
                text: !lambda |-
                  static char b[4];
                  snprintf(b, sizeof(b), "%d", id(steam_level_val));
                  return b;
            - lvgl.label.update:
                id: lbl_cfg_hint
                text: "tap to cycle 1-3"
      - if:
          condition:
            lambda: 'return id(cfg_i) == 2;'
          then:
            - lvgl.label.update:
                id: lbl_cfg_icon
                text: "󰔏"
            - lvgl.label.update:
                id: lbl_cfg_name
                text: "COFFEE TEMP"
            - lvgl.label.update:
                id: lbl_cfg_value
                text_font: montserrat_48
                text: !lambda |-
                  static char b[10];
                  snprintf(b, sizeof(b), "%.1f", id(coffee_temp_val));
                  return b;
            - lvgl.label.update:
                id: lbl_cfg_hint
                text: !lambda |-
                  std::string s = id(cfg_edit) ? "turn to set, tap to save"
                                               : "tap to adjust";
                  return s;
      # The one number on this page that is a matter of taste rather than a
      # machine setting -- and the reason a 1:1.72 shot was showing a red
      # ring. Editable here so it can be corrected standing at the machine,
      # right after tasting, which is the only moment you actually know.
      - if:
          condition:
            lambda: 'return id(cfg_i) == 3;'
          then:
            - lvgl.label.update:
                id: lbl_cfg_icon
                text: "󰗑"
            - lvgl.label.update:
                id: lbl_cfg_name
                text: "TARGET RATIO"
            - lvgl.label.update:
                id: lbl_cfg_value
                text_font: montserrat_48
                text: !lambda |-
                  static char b[12];
                  snprintf(b, sizeof(b), "1:%.2f", id(ratio_val));
                  return b;
            - lvgl.label.update:
                id: lbl_cfg_hint
                text: !lambda |-
                  std::string s = id(cfg_edit) ? "turn to set, tap to save"
                                               : "tap to adjust";
                  return s;
      # Which beans are in the hopper. The value shown is whatever of the
      # HA option this display can actually draw -- see beans_hop_ascii.
      # The grinder's recipe target can only be changed at the grinder, so
      # this is the one way to aim at a different time from the machine
      # side. Zero is not a time -- it means "no opinion, follow the recipe".
      - if:
          condition:
            lambda: 'return id(cfg_i) == 4;'
          then:
            - lvgl.label.update:
                id: lbl_cfg_icon
                text: "󰔛"
            - lvgl.label.update:
                id: lbl_cfg_name
                text: "TARGET TIME"
            - lvgl.label.update:
                id: lbl_cfg_value
                text_font: montserrat_48
                text: !lambda |-
                  static char b[12];
                  if (id(tgt_time_val) < 0.5f) {
                    snprintf(b, sizeof(b), "auto");
                  } else {
                    snprintf(b, sizeof(b), "%.0fs", id(tgt_time_val));
                  }
                  return b;
            - lvgl.label.update:
                id: lbl_cfg_hint
                text: !lambda |-
                  if (id(tgt_time_val) < 0.5f) {
                    return std::string("following the grinder");
                  }
                  return id(cfg_edit) ? std::string("turn to set, tap to save")
                                      : std::string("turn to 0 for auto");
      - if:
          condition:
            lambda: 'return id(cfg_i) == 5;'
          then:
            - lvgl.label.update:
                id: lbl_cfg_icon
                text: "󰅶"
            - lvgl.label.update:
                id: lbl_cfg_name
                text: "BEANS"
            - lvgl.label.update:
                id: lbl_cfg_value
                text_font: montserrat_20
                text: !lambda 'return id(beans_hop_ascii);'
            - lvgl.label.update:
                id: lbl_cfg_hint
                text: !lambda |-
                  if (id(cfg_edit)) {
                    return std::string("turn to pick, tap to keep");
                  }
                  return std::string("tap to change - HOLD to save");
      # Machine pre-infusion. Disabled / prebrew (pump pulses on-off-on) /
      # preinfusion (line pressure only, then the pump). The Micra exposes
      # them as one select, so this cycles rather than toggles.
      - if:
          condition:
            lambda: 'return id(cfg_i) == 6;'
          then:
            - lvgl.label.update:
                id: lbl_cfg_icon
                text: "󰖏"
            - lvgl.label.update:
                id: lbl_cfg_name
                text: "PRE-INFUSION"
            - lvgl.label.update:
                id: lbl_cfg_value
                text_font: montserrat_20
                text: !lambda |-
                  switch (id(preinf_mode_val)) {
                    case 0:  return "OFF";
                    case 1:  return "PREBREW";
                    default: return "PREINFUSION";
                  }
            - lvgl.label.update:
                id: lbl_cfg_hint
                text: "tap to cycle"
      # Only meaningful in preinfusion mode -- prebrew uses its own on/off
      # pair, which HA exposes as two other numbers, and marks this one
      # unavailable. Show n/a rather than a stale figure.
      - if:
          condition:
            lambda: 'return id(cfg_i) == 7;'
          then:
            - lvgl.label.update:
                id: lbl_cfg_icon
                text: "󰔛"
            - lvgl.label.update:
                id: lbl_cfg_name
                text: "PRE-INF TIME"
            - lvgl.label.update:
                id: lbl_cfg_value
                text_font: montserrat_48
                text: !lambda |-
                  static char b[12];
                  if (id(preinf_mode_val) != 2) {
                    snprintf(b, sizeof(b), "n/a");
                  } else {
                    snprintf(b, sizeof(b), "%.1fs", id(preinf_time_val));
                  }
                  return b;
            - lvgl.label.update:
                id: lbl_cfg_hint
                text: !lambda |-
                  if (id(preinf_mode_val) != 2) {
                    return std::string("set mode to PREINFUSION");
                  }
                  return id(cfg_edit) ? std::string("turn to set, tap to save")
                                      : std::string("tap to adjust");
      # The other half of pre-infusion. In prebrew the machine pulses the
      # pump on-off-on instead of leaning on line pressure, and these two
      # numbers are that pulse. They go unavailable in any other mode, which
      # is why the card says which mode to pick rather than showing a stale
      # figure -- the same treatment PRE-INF TIME gets.
      - if:
          condition:
            lambda: 'return id(cfg_i) == 8;'
          then:
            - lvgl.label.update:
                id: lbl_cfg_icon
                text: "󰖏"
            - lvgl.label.update:
                id: lbl_cfg_name
                text: "PREBREW ON"
            - lvgl.label.update:
                id: lbl_cfg_value
                text_font: montserrat_48
                text: !lambda |-
                  static char b[12];
                  if (id(preinf_mode_val) != 1) {
                    snprintf(b, sizeof(b), "n/a");
                  } else {
                    snprintf(b, sizeof(b), "%.1fs", id(prebrew_on_val));
                  }
                  return b;
            - lvgl.label.update:
                id: lbl_cfg_hint
                text: !lambda |-
                  if (id(preinf_mode_val) != 1) {
                    return std::string("set mode to PREBREW");
                  }
                  return id(cfg_edit) ? std::string("turn to set, tap to save")
                                      : std::string("tap to adjust");
      - if:
          condition:
            lambda: 'return id(cfg_i) == 9;'
          then:
            - lvgl.label.update:
                id: lbl_cfg_icon
                text: "󰖏"
            - lvgl.label.update:
                id: lbl_cfg_name
                text: "PREBREW OFF"
            - lvgl.label.update:
                id: lbl_cfg_value
                text_font: montserrat_48
                text: !lambda |-
                  static char b[12];
                  if (id(preinf_mode_val) != 1) {
                    snprintf(b, sizeof(b), "n/a");
                  } else {
                    snprintf(b, sizeof(b), "%.1fs", id(prebrew_off_val));
                  }
                  return b;
            - lvgl.label.update:
                id: lbl_cfg_hint
                text: !lambda |-
                  if (id(preinf_mode_val) != 1) {
                    return std::string("set mode to PREBREW");
                  }
                  return id(cfg_edit) ? std::string("turn to set, tap to save")
                                      : std::string("tap to adjust");
      - if:
          condition:
            lambda: 'return id(cfg_i) == 10;'
          then:
            - lvgl.label.update:
                id: lbl_cfg_icon
                text: "󰫠"
            - lvgl.label.update:
                id: lbl_cfg_name
                text: "BACKFLUSH"
            - lvgl.label.update:
                id: lbl_cfg_value
                text_font: montserrat_48
                text: "CLEAN"
            - lvgl.label.update:
                id: lbl_cfg_hint
                text: "HOLD to start"
      - if:
          condition:
            lambda: 'return id(cfg_i) == 11;'
          then:
            - lvgl.label.update:
                id: lbl_cfg_icon
                text: "󰁍"
            - lvgl.label.update:
                id: lbl_cfg_name
                text: "BACK"
            - lvgl.label.update:
                id: lbl_cfg_value
                text_font: montserrat_48
                text: ""
            - lvgl.label.update:
                id: lbl_cfg_hint
                text: "tap to exit"

  # Good = the ratio AND the time both inside your own bands. See calc_verdict.
  - id: shot_result
    mode: restart
    then:
      # Kill the waiting animation on the first message of the bundle, not
      # after the settle delay -- the point of it is honesty about state.
      - lambda: 'id(waiting_shot) = false;'
      # the bundle arrives as several messages; let all of them land first
      - delay: 800ms
      - script.execute: calc_verdict
      - lambda: |-
          // A single NaN used to poison prev_grind permanently: every later
          // delta came out NaN, NaN != 0 kept the line amber for good, and
          // the (int) cast of it was undefined behaviour.
          float g = id(sync_grind).state;
          if (!std::isnan(g)) {
            id(grind_delta) = id(have_grind) ? (g - id(prev_grind)) : 0.0f;
            id(prev_grind) = g;
            id(have_grind) = true;
          }
          // A new shot is unrated by definition. Without this the card would
          // show the previous cup's verdict as if it were this one's.
          // Close any rating still open rather than rewinding it. Leaving
          // rate_mode set let it survive into the NEXT shot, where a single
          // tap stapled yesterday's serve and taste onto today's cup; and
          // resetting only the step sent that tap to 'advance' instead of
          // 'commit' when a late bundle landed mid-rating.
          id(rate_mode) = false;
          id(rate_step) = 0;
          id(rated_shot) = false;
      - script.execute: paint_result
      - script.execute: paint_grind
      - script.execute: paint_main
      - light.turn_on: back_light
      - script.execute: screentime
      # Do not steal the screen from someone who deliberately walked away
      # from it, and NEVER from a shot that is currently pouring.
      #
      # MEASURED 8 Aug, back-to-back shots at 18:46 / 18:49 / 18:51 / 18:53:
      # the Sync record lands 21-92 s after extraction ends, so at that
      # cadence the PREVIOUS shot's record routinely arrives in the middle of
      # the NEXT one. This block then replaced the live timer with the old
      # shot's result card -- which reads exactly like "it counted and then
      # it just stopped, while the shot is literally going". The timer was
      # still running underneath; it had simply been covered up.
      #
      # A live extraction outranks everything. Settings and a running clean
      # cycle keep their existing precedence. card_i is set too, so the
      # carousel carries on from the SHOT card afterwards.
      - if:
          condition:
            and:
              - lambda: 'return !id(shot_running);'
              - not:
                  or:
                    - lvgl.page.is_showing: page_cfg
                    - lvgl.page.is_showing: page_clean
          then:
            - lambda: 'id(card_i) = 1;'
            - lvgl.page.show: page_result
      - script.execute:
          id: haptic
          effect: 1
      # Long enough to read it AND rate it. Measured 8 Aug: the rating went
      # in 86 s after the bundle landed, so the old 30 s had already dumped
      # him back to main and made him hunt for the card. Never yanks the
      # card away while you are mid-rating.
      - delay: 60s
      - if:
          condition:
            and:
              - lvgl.page.is_showing: page_result
              - lambda: 'return !id(rate_mode);'
          then:
            - script.execute: go_main

  - id: paint_result
    mode: restart
    then:
      # Recomputed from live sensors on EVERY paint. shot_result also does
      # this, but deriving it here as well means the card physically cannot
      # show a stale ratio, whatever order the bundle arrives in.
      - script.execute: calc_verdict
      - lvgl.label.update:
          id: lbl_res_when
          text: !lambda 'return id(when_txt);'
      - lvgl.label.update:
          id: lbl_res_ratio
          text: !lambda |-
            static char b[16];
            snprintf(b, sizeof(b), "1 : %.1f", id(last_ratio));
            return b;
          # The number answers for the ratio alone; the ring aggregates.
          text_color: !lambda 'return lv_color_hex(id(ratio_c));'
      - lvgl.widget.update:
          id: ring_result
          border_color: !lambda 'return lv_color_hex(id(res_c));'
      - lvgl.label.update:
          id: lbl_res_gram
          text: !lambda |-
            static char b[28];
            snprintf(b, sizeof(b), "%.1f -> %.1f g",
                     id(sync_dose).state, id(sync_yield).state);
            return b;
      # The time line, end to end: what the shot took, what the recipe asked
      # for, how far the dose landed from ITS target, and the machine's own
      # word on the timing. Verdicts are spelled out rather than left as
      # OFF_ABOVE, which reads like an error code. Falls back to the overall
      # shot_quality if the per-axis brew-time verdict is not being published.
      - lvgl.label.update:
          id: lbl_res_meta
          text: !lambda |-
            static char b[56];
            float d = id(sync_dose).state;
            float tg = id(sync_dose_target).state;
            float tt = id(mk_time_target).state;
            auto tq = id(mk_time_quality).state;
            auto q = tq.empty() ? id(sync_quality).state : tq;
            const char *verdict = q == "OFF_BELOW" ? "too fast"
                                : q == "OFF_ABOVE" ? "too slow"
                                : q == "OK"        ? "on time" : q.c_str();
            char head[20];
            if (std::isnan(tt) || tt <= 0.1f)
              snprintf(head, sizeof(head), "%.1f s", id(sync_time).state);
            else
              snprintf(head, sizeof(head), "%.1f / %.0f s",
                       id(sync_time).state, tt);
            if (std::isnan(tg) || tg <= 0.1f)
              snprintf(b, sizeof(b), "%s   %s", head, verdict);
            else
              snprintf(b, sizeof(b), "%s   %+.1f g   %s", head, d - tg,
                       verdict);
            return std::string(b);
          # This line used to be coloured by Mahlkonig's DOSE verdict, which
          # says nothing you can act on -- Sync manages dose itself, and it
          # meant the ring could read red while the line read green about the
          # same shot. It is now coloured by the thing it actually leads with:
          # whether shot time landed in the window. Ring aggregates, the big
          # number answers ratio, this answers time. calc_verdict owns the
          # decision so this line and the ring cannot use different targets.
          text_color: !lambda 'return lv_color_hex(id(time_c));'
      - lvgl.label.update:
          id: lbl_res_grind
          text: !lambda |-
            static char b[40];
            // NO finer/coarser advice here, deliberately. Grind-by-Sync is
            // already an integral controller on this exact variable, with a
            // full shot of dead time. Telling a human to make the same
            // correction the grinder just made puts two loops on one plant
            // and they fight: overshoot, then hunting. Report what it did
            // and let it converge.
            float gf = id(sync_grind).state;
            if (std::isnan(gf)) { snprintf(b, sizeof(b), "GRIND --"); return b; }
            int g = (int) gf;
            int d = (int) lroundf(id(grind_delta));
            if (d == 0) snprintf(b, sizeof(b), "GRIND %d", g);
            else snprintf(b, sizeof(b), "GRIND %d   %+d", g, d);
            return b;
          text_color: !lambda |-
            uint32_t c = (id(grind_delta) != 0.0f) ? 0xC8913C : 0x6A6A6A;
            return lv_color_hex(c);
      # Three-step rating lives on this one line. Step 0 is how it was drunk,
      # which is known before tasting and frames everything after it. Step 1
      # is the taste axis -- sour and bitter are the only tasting words that
      # mean something mechanical (under- vs over-extracted). Step 2 is plain
      # liking, which no measurement implies. Once logged the line leads with
      # the serve, because it is the field that explains the other two.
      - lvgl.label.update:
          id: lbl_res_rate
          text: !lambda |-
            static char b[40];
            static const char *TP[] = {"SOUR", "SOUR-ISH", "BALANCED",
                                       "BITTER-ISH", "BITTER"};
            static const char *TS[] = {"sour", "sour-ish", "balanced",
                                       "bitter-ish", "bitter"};
            int i = id(taste_val) + 2;
            if (i < 0) i = 0;
            if (i > 4) i = 4;
            if (id(rate_mode)) {
              if (id(rate_step) == 0)
                return std::string(id(serve_i) == 0 ? "ESPRESSO" : "MILK");
              if (id(rate_step) == 1) return std::string(TP[i]);
              snprintf(b, sizeof(b), "%d / 5", id(rate_val));
              return std::string(b);
            }
            if (id(rated_shot)) {
              snprintf(b, sizeof(b), "%s - %s   %d / 5",
                       id(serve_i) == 0 ? "espresso" : "milk",
                       TS[i], id(rate_val));
              return std::string(b);
            }
            return std::string("hold to rate");
          # Dim grey read as decoration, so the one thing the machine cannot
          # measure went unrated. Warm it up: it is an invitation, not a note.
          # While picking taste the word carries its own colour, so the
          # sour/bitter end you are on is readable without reading.
          text_color: !lambda |-
            static const uint32_t TC[] = {0xC8D14A, 0xA8C060, 0x35C759,
                                          0xC08A50, 0xB0603A};
            int i = id(taste_val) + 2;
            if (i < 0) i = 0;
            if (i > 4) i = 4;
            // Only the taste step carries a colour of its own -- the word IS
            // the reading, so the sour/bitter end is legible without reading.
            if (id(rate_mode))
              return lv_color_hex(id(rate_step) == 1 ? TC[i] : 0xFFFFFF);
            if (id(rated_shot)) return lv_color_hex(0x7A7A7A);
            return lv_color_hex(0x8A7A55);
      # Only visible while rating: which step you are on, so two taps never
      # feel like one tap that did the wrong thing.
      - lvgl.label.update:
          id: lbl_res_step
          text: !lambda |-
            if (!id(rate_mode)) return std::string("");
            if (id(rate_step) == 0) return std::string("serve      1 / 3");
            if (id(rate_step) == 1) return std::string("taste      2 / 3");
            return std::string("score      3 / 3");

  # Only ever says something when this shot is NOT on the hopper beans, so
  # its presence alone is the signal. Painted on change and at shot start,
  # never in the 10 Hz timer loop -- the string cannot move on its own.
  - id: paint_shot_beans
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_shot_beans
          text: !lambda |-
            if (!id(beans_override)) return std::string("");
            std::string s = "OTHER: " + id(beans_shot_ascii);
            if (s.size() > 26) s = s.substr(0, 26);
            return s;

  - id: paint_shot
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_shot_time
          text: !lambda |-
            static char b[12];
            snprintf(b, sizeof(b), "%u.%u", (unsigned) (id(shot_ds) / 10),
                     (unsigned) (id(shot_ds) % 10));
            return b;
      - lvgl.arc.update:
          id: arc_shot
          value: !lambda 'return (float) id(shot_ds);'

  # The wait for the Sync bundle is the one moment the knob depends on
  # somebody else's timing, so it says so out loud. The subtitle under the
  # frozen shot time is repurposed and animated at 2 Hz -- a still screen
  # reads as a crash, a moving one reads as work in progress. Padded to a
  # fixed width so the dots do not make the line jitter under centring.
  - id: paint_wait
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_shot_unit
          text: !lambda |-
            static char b[40];
            int n = (int) ((id(wait_ds) / 5) % 4);
            const char *d = n == 1 ? "." : n == 2 ? ".." : n == 3 ? "..." : "";
            snprintf(b, sizeof(b), "fetching from Mahlkonig%-3s", d);
            return std::string(b);
          text_color: 0xC8913C

  # 3 min is well past anything measured (worst so far 91 s). Past that the
  # record is probably not coming, and saying so beats an animation that
  # promises data forever.
  - id: wait_timeout
    mode: restart
    then:
      - lambda: 'id(waiting_shot) = false;'
      - lvgl.label.update:
          id: lbl_shot_unit
          text: "no data from Mahlkonig"
          text_color: 0x8C4E4E
      - script.execute: paint_main
      - delay: 8s
      - if:
          condition:
            lvgl.page.is_showing: page_shot
          then:
            - script.execute: go_main

interval:
  - interval: 100ms
    then:
      - if:
          condition:
            lambda: 'return id(shot_running);'
          then:
            # Derived from millis(), never accumulated. A 100 ms interval
            # coalesces ticks whenever the panel is being flushed, so the old
            # counter drifted LOW -- and rate_tap logs this as the shot time.
            - lambda: |-
                id(shot_ds) = (millis() - id(shot_t0)) / 100;
                // Nothing real runs past two minutes. The paddle release
                // going missing (HA restarting mid-shot) used to leave this
                // counting until morning and then log it.
                if (id(shot_ds) > 1200) {
                  id(shot_running) = false;
                  id(waiting_shot) = false;
                  ESP_LOGW("shot", "watchdog: no paddle release, stopped");
                }
            - script.execute: paint_shot
      - if:
          condition:
            lambda: 'return id(waiting_shot);'
          then:
            - lambda: 'id(wait_ds) += 1;'
            # 2 Hz on one short label: enough to read as alive, nowhere near
            # enough to bother LVGL.
            - if:
                condition:
                  lambda: 'return id(wait_ds) % 5 == 0;'
                then:
                  - script.execute: paint_wait
            - if:
                condition:
                  lambda: 'return id(wait_ds) > 1800;'
                then:
                  - script.execute: wait_timeout
      - if:
          condition:
            lambda: 'return id(clean_running);'
          then:
            - lambda: 'id(clean_ds) += 1;'
            # 5 Hz is plenty for a seconds readout and leaves LVGL alone.
            - if:
                condition:
                  lambda: 'return id(clean_ds) % 2 == 0;'
                then:
                  - script.execute: paint_clean
            # Outliving the arm window is the ONLY evidence the machine ever
            # gives that the paddle moved. It is the answer to the question
            # the user is standing there asking, so make it felt as well as
            # shown rather than letting the head line change in silence.
            - if:
                condition:
                  lambda: 'return id(clean_ds) == (uint32_t) $clean_arm_ds;'
                then:
                  - script.execute:
                      id: haptic
                      effect: 1
                  - script.execute: paint_clean
            # If the button press never reached the machine, micra_cleaning
            # never confirms. Do not strand the user on this screen.
            - if:
                condition:
                  lambda: 'return !id(clean_confirmed) && id(clean_ds) > 250;'
                then:
                  - lambda: 'id(clean_running) = false;'
                  - if:
                      condition:
                        lvgl.page.is_showing: page_clean
                      then:
                        - script.execute: go_main

# =============================================================================
# UI - 360x360 round
# =============================================================================
lvgl:
  id: my_lvgl
  displays: [main_display]
  touchscreens:
    - touchscreen_id: my_touchscreen
      long_press_time: 700ms
  color_depth: 16
  buffer_size: 24%
  bg_color: 0x000000
  # USB-C end is the top when plugged in for power. mipi_spi reports hardware
  # rotation, so LVGL does this in the panel, not on the CPU.
  rotation: 180
  pages:
    # ---------------- MAIN ----------------
    - id: page_main
      bg_color: 0x000000
      # No hidden gestures here. Everything is a visible, tappable target.
      widgets:
        # Top slot. Empty unless the boiler is still climbing, in which
        # case it is the only thing on this screen you are actually waiting
        # for. Previously occupied by a battery percentage on a device with
        # no battery.
        - label:
            id: lbl_main_ready
            text: ""
            text_font: montserrat_16
            text_color: 0xFF9A4A
            align: CENTER
            y: -150
        - obj:
            id: ring
            align: CENTER
            width: 348
            height: 348
            radius: 174
            bg_opa: TRANSP
            border_width: 6
            border_color: 0x242424
            pad_all: 0
            # LVGL sets CLICKABLE on obj by default; this one is full-screen
            # so leaving it clickable swallows every touch.
            clickable: false
            scrollable: false
        - image:
            id: img_logo
            src: img_lm
            align: CENTER
            y: -104
        - label:
            id: lbl_wordmark
            text: "LA MARZOCCO"
            text_font: montserrat_16
            text_color: 0xE31E24
            text_letter_space: 4
            align: CENTER
            y: -58
        - label:
            id: lbl_state
            text: "..."
            text_font: montserrat_48
            text_color: 0x585858
            align: CENTER
            y: -6
        - label:
            id: lbl_last
            text: ""
            text_font: montserrat_16
            text_color: 0x707070
            align: CENTER
            y: 34
        # Sits between the last-shot line and the buttons. Empty most of
        # the time, which is the point: if there is text here, something is
        # owed.
        - label:
            id: lbl_main_care
            text: ""
            text_font: montserrat_16
            text_color: 0xB0823A
            align: CENTER
            y: 54
        - button:
            id: btn_power
            align: CENTER
            x: -62
            y: 86
            width: 78
            height: 78
            radius: 39
            bg_color: 0x141414
            border_width: 2
            border_color: 0x3A3A3A
            on_short_click:
              - script.execute: screentime
              - if:
                  condition:
                    lambda: 'return millis() - id(wake_ms) > $wake_guard_ms;'
                  then:
                    - script.execute:
                        id: haptic
                        effect: 1
                    - script.execute: power_press
            widgets:
              - label:
                  id: lbl_btn_power
                  text: "󰐥"
                  text_font: mdi_40
                  text_color: 0xE31E24
                  align: CENTER
        - button:
            id: btn_menu
            align: CENTER
            x: 62
            y: 86
            width: 78
            height: 78
            radius: 39
            bg_color: 0x141414
            border_width: 2
            border_color: 0x3A3A3A
            on_short_click:
              - script.execute:
                  id: haptic
                  effect: 7
              - script.execute: screentime
              - lvgl.page.show: page_cfg
              - script.execute: paint_cfg
            widgets:
              - label:
                  text: "󰒓"
                  text_font: mdi_40
                  text_color: 0x8A8A8A
                  align: CENTER

    # ---------------- CONTROL ----------------
    - id: page_cfg
      bg_color: 0x000000
      on_short_click:
        - if:
            condition:
              lambda: 'return millis() - id(wake_ms) > $wake_guard_ms;'
            then:
              - script.execute: cfg_act
      on_long_press:
        - if:
            condition:
              lambda: |-
                return id(cfg_i) == 10
                    && millis() - id(wake_ms) > $wake_guard_ms;
            then:
              - logger.log: "CFG: starting backflush"
              # Everything about arming lives in start_clean, including the
              # wake-from-standby step -- the page should not know the order.
              - script.execute: start_clean
            else:
              - if:
                  condition:
                    lambda: |-
                      return id(cfg_i) == 5
                          && millis() - id(wake_ms) > $wake_guard_ms;
                  then:
                    # Holding on the beans item writes the machine settings
                    # that are on screen right now into the slot for the
                    # grinder's current recipe. Nothing to navigate to.
                    - script.execute: preset_save
                  else:
                    - script.execute:
                        id: haptic
                        effect: 1
                    - lambda: 'id(cfg_edit) = false;'
                    - script.execute: go_main
      widgets:
        - obj:
            id: ring_cfg
            align: CENTER
            width: 348
            height: 348
            radius: 174
            bg_opa: TRANSP
            border_width: 6
            border_color: 0xE31E24
            pad_all: 0
            clickable: false
            scrollable: false
        - label:
            id: lbl_cfg_icon
            text: "󱌙"
            text_font: mdi_40
            text_color: 0xE31E24
            align: CENTER
            y: -96
        - label:
            id: lbl_cfg_name
            text: "STEAM BOILER"
            text_font: montserrat_16
            text_color: 0x8A8A8A
            align: CENTER
            y: -50
        - label:
            id: lbl_cfg_value
            # Every paint_cfg branch sets text_font explicitly: BEANS needs
            # small type for a name, everything else is a short value that
            # earns the big face. Set it on the widget only and the first
            # visit to BEANS would shrink the rest for the rest of the boot.
            text: "..."
            text_font: montserrat_48
            text_color: 0xFFFFFF
            align: CENTER
            y: 8
        - label:
            id: lbl_cfg_hint
            text: "tap to toggle"
            text_font: montserrat_16
            text_color: 0x4A4A4A
            align: CENTER
            y: 94

    # ---------------- CLEAN / BACKFLUSH ----------------
    # Phase 1: the machine is armed and waiting for the paddle (15 s).
    # Phase 2: the paddle moved, the cycle is running (~90 s).
    # Both live here; paint_clean decides which by elapsed time.
    - id: page_clean
      bg_color: 0x000000
      # Same safety valve. Hold only -- a stray tap during a live backflush
      # should not throw the progress arc away. Nothing re-shows this page
      # once it is left, so leaving is final until the next cycle starts.
      on_long_press:
        - script.execute: go_main
      widgets:
        - arc:
            id: arc_clean
            align: CENTER
            width: 344
            height: 344
            start_angle: 270
            end_angle: 268
            min_value: 0
            max_value: 100
            value: 100
            adjustable: false
            arc_width: 14
            arc_color: 0x101822
            indicator:
              arc_width: 14
              arc_color: 0x2A6FB0
        - label:
            id: lbl_clean_head
            text: "MOVE THE PADDLE"
            text_font: montserrat_20
            text_color: 0x4FA3E3
            align: CENTER
            y: -86
        - label:
            id: lbl_clean_big
            text: "15"
            text_font: montserrat_48
            text_color: 0xFFFFFF
            align: CENTER
            y: 0
        - label:
            id: lbl_clean_sub
            text: "seconds to activate"
            text_font: montserrat_16
            text_color: 0x8A8A8A
            align: CENTER
            y: 66

    # ---------------- RESULT (Mahlkonig Sync bundle) ----------------
    - id: page_result
      bg_color: 0x000000
      # Tap: advance/commit the rating if rating, otherwise go home.
      # Hold: enter/leave rate mode -- the values the machine can't measure.
      on_short_click:
        - if:
            condition:
              lambda: 'return millis() - id(wake_ms) > $wake_guard_ms;'
            then:
              - script.execute: rate_tap
      on_long_press:
        - script.execute: rate_hold
      widgets:
        - obj:
            id: ring_result
            align: CENTER
            width: 348
            height: 348
            radius: 174
            bg_opa: TRANSP
            border_width: 6
            border_color: 0xE31E24
            pad_all: 0
            clickable: false
            scrollable: false
        - label:
            id: lbl_res_when
            text: "--"
            text_font: montserrat_16
            text_color: 0x707070
            align: CENTER
            y: -104
        - label:
            id: lbl_res_ratio
            text: "1 : 0.0"
            text_font: montserrat_48
            text_color: 0xE31E24
            align: CENTER
            y: -52
        - label:
            id: lbl_res_gram
            text: "0.0 -> 0.0 g"
            text_font: montserrat_20
            text_color: 0xFFFFFF
            align: CENTER
            y: 2
        - label:
